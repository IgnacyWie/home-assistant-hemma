french_jazz_lounge:
  alias: French Jazz Lounge
  icon: mdi:music
  mode: restart
  sequence:
    - action: media_player.volume_set
      target:
        entity_id: media_player.zeppelin
      data:
        volume_level: 0.30
    - action: music_assistant.play_media
      target:
        entity_id: media_player.zeppelin
      data:
        media_id: spotify://playlist/75tpCkAq8iJogkzHn7q6AW
        media_type: playlist
        enqueue: replace
    - delay: "00:00:01"
    - action: media_player.shuffle_set
      target:
        entity_id: media_player.zeppelin
      data:
        shuffle: true
    - action: media_player.volume_set
      target:
        entity_id: media_player.zeppelin
      data:
        volume_level: 0.30

leave_home:
  alias: Leave Home
  icon: mdi:home-export-outline
  mode: single
  sequence:
    - action: scene.turn_on
      target:
        entity_id: scene.leave_home
    - action: media_player.media_pause
      continue_on_error: true
      target:
        entity_id: media_player.zeppelin
    - action: media_player.media_pause
      continue_on_error: true
      target:
        entity_id: media_player.bedroom
    - if:
        - condition: template
          value_template: >-
            {{ states('media_player.living_room_tv_2') not in
               ['off', 'unknown', 'unavailable'] }}
      then:
        - action: media_player.turn_off
          continue_on_error: true
          target:
            entity_id: media_player.living_room_tv_2
