hemma_badge_cinema:
  template: [hemma_badge_base]

  variables:
    enabled: true

  show_state: false
  show_label: false
  show_icon: false
  show_entity_picture: true

  entity_picture: |
    [[[ return window.hemmaIconUrl('popcorn-cinema-v1'); ]]]

  tap_action:
    action: call-service
    service: input_boolean.toggle
    target:
      entity_id: '[[[ return entity?.entity_id ]]]'

  hold_action:
    action: more-info

  double_tap_action:
    action: none

  name: |
    [[[
      const on = entity?.state === 'on';
      return `<div class="badge-wrap"><div class="badge-title">Cinema Mode</div><div class="badge-sub">${on ? 'On' : 'Off'}</div></div>`;
    ]]]

  styles:
    card:
      - background: var(--badge-background, rgba(10,12,14,0.65))
      - --badge-title-color: var(--primary-text-color)
      - --badge-sub-color: var(--secondary-text-color)
    entity_picture:
      - background: '#FF9500'
      - padding: 5px
      - box-sizing: border-box
