hemma_badge_scene:
  template: [hemma_badge_base]

  variables:
    enabled: true
    label: Scene
    icon: mdi:creation
    active_entity: null
    service: scene.turn_on

  show_state: false
  show_label: false
  show_icon: false
  show_entity_picture: true

  entity_picture: |
    [[[ return window.hemmaIconUrl(variables.icon || 'scenes'); ]]]

  extra_styles: >
    [[[
      const v = variables?.enabled;
      const enabled = (v === undefined || v === null) ? true :
        (typeof v === 'boolean') ? v :
        (typeof v === 'number') ? v !== 0 :
        !['false', '0', 'no', 'off', 'disabled'].includes(String(v).trim().toLowerCase());
      return `:host { display: ${enabled ? 'inline-block' : 'none'} !important; }`;
    ]]]

  tap_action:
    action: call-service
    service: '[[[ return variables.service || "scene.turn_on"; ]]]'
    target:
      entity_id: '[[[ return entity?.entity_id ]]]'

  hold_action:
    action: more-info

  double_tap_action:
    action: none

  name: |
    [[[
      const active = variables.active_entity && states[variables.active_entity]?.state === 'on';
      const label = variables.label || entity?.attributes?.friendly_name || 'Scene';
      return `<div class="badge-wrap"><div class="badge-title">${label}</div><div class="badge-sub">${active ? 'Active' : 'Inactive'}</div></div>`;
    ]]]

  styles:
    card:
      # Actions and scenes keep the pill quiet; orange belongs to the icon.
      - background: var(--badge-background, rgba(10,12,14,0.65))
      - --badge-title-color: var(--primary-text-color)
      - --badge-sub-color: var(--secondary-text-color)
    entity_picture:
      - background: '#FF9500'
      - padding: 5px
      - box-sizing: border-box
