hemma_badge_presence:
  template: [hemma_badge_base]

  variables:
    enabled: true
    battery_entity: null
    icon: null

  show_state: false
  show_label: false
  show_entity_picture: >
    [[[ return !!variables.icon || !!entity?.attributes?.entity_picture; ]]]
  show_icon: >
    [[[ return !variables.icon && !entity?.attributes?.entity_picture; ]]]

  entity_picture: >
    [[[ return variables.icon ? window.hemmaIconUrl(variables.icon) : entity?.attributes?.entity_picture; ]]]

  extra_styles: >
    [[[
      const v = variables?.enabled;
      const enabled = (v === undefined || v === null) ? true :
        (typeof v === 'boolean') ? v :
        (typeof v === 'number') ? v !== 0 :
        !['false','0','no','off','disabled'].includes(String(v).trim().toLowerCase());

      const hasEnt  = !!entity?.entity_id;
      const stRaw   = String(entity?.state ?? '').trim();
      const st      = stRaw.toLowerCase().replace(/_/g,' ');
      const hide    = !enabled || !hasEnt || !stRaw || ['unknown','unavailable','none'].includes(st);

      return `:host{display:${hide ? 'none' : 'inline-block'} !important;order:var(--hemma-badge-order-people,3);}
        #img-cell img, #img-cell ha-img, .img-cell img, .img-cell ha-img {
          object-fit: contain !important;
          padding: 5px !important;
          box-sizing: border-box !important;
        }`;
    ]]]

  styles:
    card:
      - display: >
          [[[
            const v = variables?.enabled;
            const enabled = (v === undefined || v === null) ? true :
              (typeof v === 'boolean') ? v :
              (typeof v === 'number') ? v !== 0 :
              !['false','0','no','off','disabled'].includes(String(v).trim().toLowerCase());

            const hasEnt  = !!entity?.entity_id;
            const stRaw   = String(entity?.state ?? '').trim();
            const st      = stRaw.toLowerCase().replace(/_/g,' ');
            const hide    = !enabled || !hasEnt || !stRaw || ['unknown','unavailable','none'].includes(st);

            return hide ? 'none' : 'inline-grid';
          ]]]
      - --presence-filter: >
          [[[
            const s = String(entity?.state || '').toLowerCase().replace(/_/g, ' ');
            const on = (s === 'home' || s === 'just arrived');
            return on ? 'none' : 'grayscale(1) contrast(.96) brightness(.94)';
          ]]]
      - --presence-opacity: >
          [[[
            const s = String(entity?.state || '').toLowerCase().replace(/_/g, ' ');
            return (s === 'home' || s === 'just arrived') ? '1' : '.88';
          ]]]
      - --badge-title-color: >
          [[[
            const s = String(entity?.state || '').toLowerCase().replace(/_/g, ' ');
            return (s === 'home' || s === 'just arrived')
              ? 'var(--primary-text-color)'
              : 'var(--badge-title-inactive)';
          ]]]
      - --badge-sub-color: >
          [[[
            const s = String(entity?.state || '').toLowerCase().replace(/_/g, ' ');
            return (s === 'home' || s === 'just arrived')
              ? 'var(--secondary-text-color)'
              : 'color-mix(in oklab, var(--secondary-text-color) 70%, transparent)';
          ]]]
      - --hemma-badge-icon-bg: >
          [[[
            const s = String(entity?.state || '').toLowerCase().replace(/_/g, ' ');
            return (s === 'home' || s === 'just arrived')
              ? 'var(--hemma-badge-healthy-color, #30D158)'
              : 'rgba(255,255,255,0.10)';
          ]]]
    icon:
      - filter: var(--presence-filter)
      - -webkit-filter: var(--presence-filter)
      - opacity: var(--presence-opacity)
      - color: var(--badge-title-color)
    entity_picture:
      - filter: var(--presence-filter)
      - -webkit-filter: var(--presence-filter)
      - opacity: var(--presence-opacity)

  name: >
    [[[
      const T = window._hemmaT || ((k, en, v) => String(en).replace(/\{(\w+)\}/g,
        (m, p) => (v && Object.prototype.hasOwnProperty.call(v, p) ? String(v[p]) : m)));
      const L = (k, en) => { const v = hass?.localize?.(k); return (v && v !== k) ? v : en; };
      const friendly = (entity?.attributes?.friendly_name || T('presence.person', 'Person')).split(' ')[0];
      const raw = String(entity?.state || L('state.default.unknown', 'Unknown'));
      const s = raw.toLowerCase().replace(/_/g, ' ');
      const status =
        s === 'home'           ? L('component.person.entity_component._.state.home', 'Home') :
        s === 'not home' || s === 'away' ? L('component.person.entity_component._.state.not_home', 'Away') :
        s === 'just arrived'   ? T('presence.just_arrived', 'Just Arrived') :
        s === 'just left'      ? T('presence.just_left', 'Just Left') :
        s === 'extended away'  ? T('presence.extended_away', 'Extended Away') :
                                  raw;

      const esc = (t) => String(t || '').replaceAll('"','&quot;');
      const batteryId = variables.battery_entity;
      const batteryValue = batteryId ? parseFloat(states[batteryId]?.state) : NaN;
      const battery = Number.isFinite(batteryValue) ? ` · ${Math.round(batteryValue)}%` : '';

      return `
        <div class="badge-wrap">
          <div class="badge-title">${esc(friendly)}</div>
          <div class="badge-sub">${esc(status + battery)}</div>
        </div>
      `;
    ]]]
