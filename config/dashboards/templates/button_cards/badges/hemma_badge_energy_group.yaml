hemma_badge_energy_group:
  template: [hemma_badge_base, hemma_popup_energy]

  show_state: false
  show_label: false
  show_icon: true
  icon: mdi:lightning-bolt

  variables:
    enabled: true
    power_entity: null
    prominence_threshold: 1000
    # Which input_select drives the active state (mobile swaps in its filter).
    row_entity: input_select.hemma_expanded_row

  entity: input_select.hemma_expanded_row

  tap_action:
    haptic: light
    action: |
      [[[
        return window.hemmaPopupAction ? window.hemmaPopupAction() : 'more-info';
      ]]]
    entity: '[[[ return variables.entity_power || entity?.entity_id; ]]]'

  # hold_action comes from hemma_popup_energy (this room's energy popup).
  double_tap_action:
    action: none

  styles:
    card:
      - background: var(--badge-background, rgba(10,12,14,0.65))
      - display: >
          [[[
            const ev = variables?.enabled;
            const enabled = (ev === undefined || ev === null) ? true :
              (typeof ev === 'boolean') ? ev :
              (typeof ev === 'number') ? ev !== 0 :
              !['false','0','no','off','disabled'].includes(String(ev).trim().toLowerCase());
            return enabled ? 'inline-grid' : 'none';
          ]]]
      - --badge-title-color: var(--primary-text-color)
      - --badge-sub-color: var(--secondary-text-color)
      # Energy is an informational status and therefore stays neutral.
      - --hemma-badge-icon-color: var(--hemma-badge-info-color, rgba(255,255,255,0.72))
      - --hemma-badge-icon-bg: rgba(255,255,255,0.10)
      - --icon-primary-color: var(--hemma-badge-icon-color)
      - --paper-item-icon-color: var(--hemma-badge-icon-color)
      - --state-icon-color: var(--hemma-badge-icon-color)

    icon:
      - color: var(--hemma-badge-icon-color)

  name: >
    [[[
      const T = window._hemmaT || ((k, en, v) => { let s = String(en); if (v) for (const p in v) s = s.split(String.fromCharCode(123) + p + String.fromCharCode(125)).join(String(v[p])); return s; });
      const eid = variables.power_entity;
      const power = eid ? parseFloat(states[eid]?.state) : NaN;
      let sub = '';
      if (Number.isFinite(power)) {
        const decimals = Math.abs(power) >= 100 ? 0 : 1;
        sub = `${power.toFixed(decimals)} W`;
      }
      return `
        <div class="badge-wrap">
          <div class="badge-title">${T('filter.energy', 'Energy')}</div>
          ${sub ? `<div class="badge-sub">${sub}</div>` : ''}
        </div>
      `;
    ]]]

  extra_styles: >
    [[[
      const ev = variables?.enabled;
      const enabled = (ev === undefined || ev === null) ? true :
        (typeof ev === 'boolean') ? ev :
        (typeof ev === 'number') ? ev !== 0 :
        !['false','0','no','off','disabled'].includes(String(ev).trim().toLowerCase());
      const URL = window.hemmaIconUrl('energy');
      const pid = variables.power_entity || variables.entity_power;
      const watts = pid ? parseFloat(states[pid]?.state) : NaN;
      const prominent = Number.isFinite(watts)
        && watts > Number(variables.prominence_threshold ?? 1000);

      return `:host{display:${enabled ? 'inline-block' : 'none'} !important;order:${prominent ? '-10' : 'var(--hemma-badge-order-energy,6)'};}
        #img-cell, .img-cell{ position: relative; }

        #img-cell #icon, .img-cell #icon{
          color: transparent !important;
          opacity: 0 !important;
        }

        #img-cell::before,
        .img-cell::before{
          content: '';
          position: absolute;
          inset: 0;
          background-color: var(--hemma-badge-icon-color, var(--hemma-badge-energy-color, #30D158)) !important;
          -webkit-mask: url('${URL}') no-repeat center / auto 82%;
          mask: url('${URL}') no-repeat center / auto 82%;
          transform: translateZ(0);
        }`;
    ]]]
