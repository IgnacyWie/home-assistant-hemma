hemma_badge_active_devices:
  template: [hemma_badge_base]
  # The summary aggregates a variable-driven list, so button-card cannot infer
  # which entities should trigger a re-render.
  triggers_update: all

  variables:
    enabled: false
    entity_1: null
    entity_2: null
    entity_3: null
    entity_4: null
    entity_5: null
    entity_6: null
    entity_7: null
    entity_8: null
    entity_9: null
    entity_10: null
    entity_11: null
    entity_12: null
    entity_13: null
    entity_14: null
    entity_15: null
    entity_16: null
    all_off_entity: script.leave_home

  show_state: false
  show_label: false
  show_icon: true
  icon: mdi:power-standby

  extra_styles: >
    [[[
      const configured = [
        variables.entity_1, variables.entity_2, variables.entity_3, variables.entity_4,
        variables.entity_5, variables.entity_6, variables.entity_7, variables.entity_8,
        variables.entity_9, variables.entity_10, variables.entity_11, variables.entity_12,
        variables.entity_13, variables.entity_14, variables.entity_15, variables.entity_16
      ].filter(Boolean);
      const v = variables.enabled;
      const enabled = v === true || v === 1 || String(v).toLowerCase() === 'true';
      const visible = enabled && configured.length;
      return `:host{display:${visible ? 'inline-block' : 'none'} !important;order:-20;}`;
    ]]]

  tap_action:
    haptic: light
    action: fire-dom-event
    hemma_popup:
      title: "What's still on?"
      dismissable: true
      dismiss_on_background: true
      popup_styles:
        - style: all
          styles: |
            --popup-min-width: 360px;
            --popup-max-width: 420px;
            --hemma-popup-radius: 28px;
            --hemma-popup-header-gap: 8px;
            --hemma-popup-tint: rgba(18, 18, 22, 0.88);
            --hemma-popup-grain: 0;
            --hemma-popup-grain-dark: 0;
      content: |
        [[[
          const ids = [
            variables.entity_1, variables.entity_2, variables.entity_3, variables.entity_4,
            variables.entity_5, variables.entity_6, variables.entity_7, variables.entity_8,
            variables.entity_9, variables.entity_10, variables.entity_11, variables.entity_12,
            variables.entity_13, variables.entity_14, variables.entity_15, variables.entity_16
          ].filter(Boolean);
          const allOffEntity = variables.all_off_entity || 'script.leave_home';
          const inactiveMedia = ['off', 'idle', 'paused', 'standby', 'unknown', 'unavailable'];
          const activeExpr = (id) => `
            const id = ${JSON.stringify(id)};
            const state = String(states[id]?.state || '').toLowerCase();
            const active = id.startsWith('media_player.')
              ? !${JSON.stringify(inactiveMedia)}.includes(state)
              : state === 'on';
          `;
          const row = (id) => ({
            type: 'custom:button-card',
            entity: id,
            hidden: `[[[ ${activeExpr(id)} return !active; ]]]`,
            show_icon: true,
            show_name: true,
            show_state: false,
            show_label: true,
            name: `[[[ return entity?.attributes?.friendly_name || ${JSON.stringify(id)}; ]]]`,
            label: 'On',
            icon: `[[[ return entity?.attributes?.icon || (
              ${JSON.stringify(id)}.startsWith('light.') ? 'mdi:lightbulb' :
              ${JSON.stringify(id)}.startsWith('fan.') ? 'mdi:fan' :
              ${JSON.stringify(id)}.startsWith('media_player.') ? 'mdi:television-speaker' :
              'mdi:power-socket-eu'
            ); ]]]`,
            tap_action: {
              haptic: 'medium',
              action: 'call-service',
              service: 'homeassistant.turn_off',
              service_data: { entity_id: id },
            },
            custom_fields: {
              control: '<span>Turn off</span>',
            },
            extra_styles: `
              :host{display:block!important;width:100%!important;margin:0!important;}
              ha-card{transition:transform .16s ease,filter .16s ease!important;}
              ha-card:active{transform:scale(.98)!important;}
              @media(hover:hover){ha-card:hover{filter:brightness(1.08)!important;}}
            `,
            styles: {
              card: [
                { background: 'rgba(255,255,255,0.09)' },
                { 'border-radius': '20px' },
                { border: 'none' },
                { 'box-shadow': 'none' },
                { padding: '12px 14px' },
                { cursor: 'pointer' },
              ],
              grid: [
                { 'grid-template-areas': '"i n control" "i l control"' },
                { 'grid-template-columns': '38px minmax(0,1fr) auto' },
                { 'grid-template-rows': 'min-content min-content' },
                { 'column-gap': '12px' },
                { 'align-items': 'center' },
              ],
              icon: [
                { color: '#FF9F0A' },
                { width: '22px' },
              ],
              img_cell: [
                { 'grid-area': 'i' },
                { width: '38px' },
                { height: '38px' },
                { 'border-radius': '50%' },
                { background: 'rgba(255,159,10,0.16)' },
              ],
              name: [
                { 'grid-area': 'n' },
                { color: 'var(--primary-text-color)' },
                { 'font-size': '15px' },
                { 'font-weight': '600' },
                { 'text-align': 'left' },
                { 'justify-self': 'start' },
                { overflow: 'hidden' },
                { 'text-overflow': 'ellipsis' },
                { 'white-space': 'nowrap' },
              ],
              label: [
                { 'grid-area': 'l' },
                { color: 'var(--secondary-text-color)' },
                { 'font-size': '12px' },
                { 'text-align': 'left' },
                { 'justify-self': 'start' },
              ],
              custom_fields: {
                control: [
                  { 'grid-area': 'control' },
                  { color: '#FF9F0A' },
                  { 'font-size': '12px' },
                  { 'font-weight': '700' },
                  { padding: '7px 10px' },
                  { 'border-radius': '999px' },
                  { background: 'rgba(255,159,10,0.14)' },
                ],
              },
            },
          });

          const emptyCard = {
            type: 'custom:button-card',
            triggers_update: 'all',
            hidden: `[[[
              const ids = ${JSON.stringify(ids)};
              const inactiveMedia = ${JSON.stringify(inactiveMedia)};
              const active = ids.some(id => {
                const state = String(states[id]?.state || '').toLowerCase();
                return id.startsWith('media_player.') ? !inactiveMedia.includes(state) : state === 'on';
              });
              return active;
            ]]]`,
            show_icon: true,
            show_name: true,
            icon: 'mdi:check-circle',
            name: 'Everything off',
            tap_action: { action: 'none' },
            styles: {
              card: [
                { background: 'rgba(48,209,88,0.12)' },
                { 'border-radius': '20px' },
                { border: 'none' },
                { 'box-shadow': 'none' },
                { padding: '18px' },
              ],
              grid: [
                { 'grid-template-areas': '"i n"' },
                { 'grid-template-columns': '32px 1fr' },
                { 'column-gap': '10px' },
                { 'align-items': 'center' },
              ],
              icon: [{ color: '#30D158' }, { width: '24px' }],
              name: [
                { color: 'var(--primary-text-color)' },
                { 'font-size': '15px' },
                { 'font-weight': '600' },
                { 'text-align': 'left' },
                { 'justify-self': 'start' },
              ],
            },
          };

          const allOffCard = {
            type: 'custom:button-card',
            triggers_update: 'all',
            hidden: `[[[
              const ids = ${JSON.stringify(ids)};
              const inactiveMedia = ${JSON.stringify(inactiveMedia)};
              return !ids.some(id => {
                const state = String(states[id]?.state || '').toLowerCase();
                return id.startsWith('media_player.') ? !inactiveMedia.includes(state) : state === 'on';
              });
            ]]]`,
            show_icon: true,
            show_name: true,
            icon: 'mdi:power',
            name: 'All Off',
            tap_action: {
              haptic: 'medium',
              action: 'call-service',
              service: 'script.turn_on',
              target: { entity_id: allOffEntity },
            },
            styles: {
              card: [
                { background: 'rgba(255,69,58,0.92)' },
                { 'border-radius': '20px' },
                { border: 'none' },
                { 'box-shadow': 'none' },
                { padding: '13px 16px' },
                { margin: '4px 0 0' },
              ],
              grid: [
                { 'grid-template-areas': '"i n"' },
                { 'grid-template-columns': '24px auto' },
                { 'column-gap': '8px' },
                { 'justify-content': 'center' },
                { 'align-items': 'center' },
              ],
              icon: [{ color: 'white' }, { width: '20px' }],
              name: [{ color: 'white' }, { 'font-size': '14px' }, { 'font-weight': '700' }],
            },
          };

          return {
            type: 'vertical-stack',
            cards: [emptyCard, ...ids.map(row), allOffCard],
            card_mod: {
              style: ':host{display:block;width:100%;} #root{display:flex;flex-direction:column;gap:8px;}',
            },
          };
        ]]]

  hold_action:
    action: none

  double_tap_action:
    action: none

  name: |
    [[[
      const ids = [
        variables.entity_1, variables.entity_2, variables.entity_3, variables.entity_4,
        variables.entity_5, variables.entity_6, variables.entity_7, variables.entity_8,
        variables.entity_9, variables.entity_10, variables.entity_11, variables.entity_12,
        variables.entity_13, variables.entity_14, variables.entity_15, variables.entity_16
      ].filter(Boolean);
      const inactiveMedia = ['off', 'idle', 'paused', 'standby', 'unknown', 'unavailable'];
      const active = ids.filter(id => {
        const state = String(states[id]?.state || '').toLowerCase();
        return id.startsWith('media_player.') ? !inactiveMedia.includes(state) : state === 'on';
      });
      const lightCount = active.filter(id => id.startsWith('light.')).length;
      const tvCount = active.filter(id => id.startsWith('media_player.') && /tv|television/.test(id)).length;
      const friendly = id => states[id]?.attributes?.friendly_name || id.split('.').pop().replace(/_/g, ' ');
      let summary;
      if (!active.length) summary = 'Everything off';
      else if (active.length === 1) summary = friendly(active[0]) + ' on';
      else if (tvCount === 1 && lightCount === active.length - 1) {
        summary = `TV and ${lightCount} light${lightCount === 1 ? '' : 's'} on`;
      } else if (lightCount === active.length) {
        summary = `${lightCount} lights on`;
      } else if (active.length === 2) {
        summary = `${friendly(active[0])} and ${friendly(active[1])} on`;
      } else summary = `${active.length} devices on`;
      const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      return `<div class="badge-wrap"><div class="badge-title">What's still on?</div><div class="badge-sub">${esc(summary)}</div></div>`;
    ]]]

  styles:
    card:
      - background: var(--badge-background, rgba(10,12,14,0.65))
      - --badge-title-color: var(--primary-text-color)
      - --badge-sub-color: var(--secondary-text-color)
      - --hemma-badge-icon-bg: >
          [[[
            const ids = [
              variables.entity_1, variables.entity_2, variables.entity_3, variables.entity_4,
              variables.entity_5, variables.entity_6, variables.entity_7, variables.entity_8,
              variables.entity_9, variables.entity_10, variables.entity_11, variables.entity_12,
              variables.entity_13, variables.entity_14, variables.entity_15, variables.entity_16
            ].filter(Boolean);
            const inactiveMedia = ['off', 'idle', 'paused', 'standby', 'unknown', 'unavailable'];
            const active = ids.some(id => {
              const state = String(states[id]?.state || '').toLowerCase();
              return id.startsWith('media_player.') ? !inactiveMedia.includes(state) : state === 'on';
            });
            return active
              ? 'var(--hemma-badge-attention-color, #FF453A)'
              : 'var(--hemma-badge-healthy-color, #30D158)';
          ]]]
    icon:
      - color: white
