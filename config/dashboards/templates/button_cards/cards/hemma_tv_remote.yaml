# Touch-friendly TV remote popup for tablet and desktop dashboards.
# Commands are sent to the existing Android TV remote entity.
hemma_tv_remote_button:
  template: hemma_default
  show_icon: false
  show_name: false
  show_label: false
  label: '[[[ return variables.label || ""; ]]]'
  tooltip: '[[[ return variables.label || ""; ]]]'
  variables:
    primary: false

  tap_action:
    haptic: light
    action: call-service
    service: remote.send_command
    target:
      entity_id: '[[[ return variables.remote_entity || "remote.living_room_tv"; ]]]'
    data:
      command: '[[[ return variables.command || ""; ]]]'

  hold_action:
    action: none
  double_tap_action:
    action: none

  styles:
    card:
      - width: 72px
      - height: 72px
      - padding: 6px
      - border-radius: 18px
      - background: >-
          [[[
            return variables.primary ? '#f5f5f7' : 'rgba(255,255,255,0.09)';
          ]]]
      - color: >-
          [[[
            return variables.primary ? '#1d1d1f' : 'rgba(255,255,255,0.96)';
          ]]]
      - border: none !important
      - box-shadow: none !important
      - transition: transform 0.12s ease, background 0.12s ease
    grid:
      - grid-template-areas: '"g"'
      - grid-template-columns: 1fr
      - grid-template-rows: 1fr
    custom_fields:
      g:
        - grid-area: g
        - align-self: center
        - justify-self: center
        - line-height: 1
        - font-size: 26px
        - font-weight: 500
        - color: >-
            [[[
              return variables.primary ? '#1d1d1f' : 'rgba(255,255,255,0.96)';
            ]]]
    label:
      - grid-area: l
      - align-self: end
      - justify-self: center
      - color: rgba(255,255,255,0.72)
      - font-size: 10px
      - font-weight: 600
      - letter-spacing: 0.01em
      - line-height: 1.1

  custom_fields:
    g: >-
      [[[ return `<span aria-label="${variables.label || ''}">${variables.glyph || ''}</span>`; ]]]

  extra_styles: |
    ha-card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: rgba(255,255,255,0.10);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    ha-card:hover::before,
    ha-card:focus-within::before {
      opacity: 1;
    }
    ha-card:active {
      transform: scale(0.94) !important;
    }

hemma_tv_remote_panel:
  template: hemma_default
  show_icon: false
  show_state: false
  show_label: false
  show_name: false
  variables:
    remote_entity: remote.living_room_tv

  tap_action:
    action: none
  hold_action:
    action: none

  styles:
    card:
      - width: calc(var(--popup-min-width, 360px) - 32px)
      - max-width: 100%
      - min-height: 252px
      - padding: 12px 0 0
      - box-sizing: border-box
      - border-radius: 0
      - background: transparent !important
      - box-shadow: none !important
      - border: none !important
    grid:
      - grid-template-areas: '"back up pause" "left select right" ". down ."'
      - grid-template-columns: repeat(3, 1fr)
      - grid-template-rows: repeat(3, 72px)
      - column-gap: 10px
      - row-gap: 10px
    custom_fields:
      back:
        - grid-area: back
        - align-self: center
        - justify-self: center
      up:
        - grid-area: up
        - align-self: center
        - justify-self: center
      pause:
        - grid-area: pause
        - align-self: center
        - justify-self: center
      left:
        - grid-area: left
        - align-self: center
        - justify-self: center
      select:
        - grid-area: select
        - align-self: center
        - justify-self: center
      right:
        - grid-area: right
        - align-self: center
        - justify-self: center
      down:
        - grid-area: down
        - align-self: center
        - justify-self: center

  custom_fields:
    back:
      card:
        type: custom:button-card
        template: hemma_tv_remote_button
        variables:
          remote_entity: '[[[ return variables.remote_entity; ]]]'
          command: BACK
          glyph: '‹'
          label: Back
    up:
      card:
        type: custom:button-card
        template: hemma_tv_remote_button
        variables:
          remote_entity: '[[[ return variables.remote_entity; ]]]'
          command: DPAD_UP
          glyph: '↑'
          label: Up
    pause:
      card:
        type: custom:button-card
        template: hemma_tv_remote_button
        variables:
          remote_entity: '[[[ return variables.remote_entity; ]]]'
          command: MEDIA_PLAY_PAUSE
          glyph: 'Ⅱ'
          label: Pause
    left:
      card:
        type: custom:button-card
        template: hemma_tv_remote_button
        variables:
          remote_entity: '[[[ return variables.remote_entity; ]]]'
          command: DPAD_LEFT
          glyph: '←'
          label: Left
    select:
      card:
        type: custom:button-card
        template: hemma_tv_remote_button
        variables:
          remote_entity: '[[[ return variables.remote_entity; ]]]'
          command: DPAD_CENTER
          glyph: '●'
          label: Select
          primary: true
    right:
      card:
        type: custom:button-card
        template: hemma_tv_remote_button
        variables:
          remote_entity: '[[[ return variables.remote_entity; ]]]'
          command: DPAD_RIGHT
          glyph: '→'
          label: Right
    down:
      card:
        type: custom:button-card
        template: hemma_tv_remote_button
        variables:
          remote_entity: '[[[ return variables.remote_entity; ]]]'
          command: DPAD_DOWN
          glyph: '↓'
          label: Down

  extra_styles: |
    :host {
      display: block !important;
      width: calc(var(--popup-min-width, 360px) - 32px) !important;
      max-width: 100% !important;
      margin-left: auto !important;
      margin-right: 0 !important;
    }
    ha-card {
      overflow: visible !important;
    }
