  extra_styles: |
    :host {
      display: block !important;
      width: calc(var(--popup-min-width, 360px) - 32px) !important;
      max-width: 100% !important;
      margin-left: auto !important;
      margin-right: 0 !important;
    }
    ha-card {
      overflow: visible !important;
    }
    .hemma-tv-now {
      width: 100%;
      height: 70px;
      box-sizing: border-box;
      display: grid;
      grid-template-columns: 58px minmax(0, 1fr);
      align-items: center;
      gap: 11px;
      padding: 6px;
      border-radius: 18px;
      background: rgba(255,255,255,0.075);
      overflow: hidden;
    }
    .hemma-tv-now-art,
    .hemma-tv-now-fallback {
      width: 58px;
      height: 58px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      object-fit: cover;
      background: rgba(255,255,255,0.09);
      color: rgba(255,255,255,0.80);
    }
    .hemma-tv-now-fallback ha-icon {
      width: 25px;
      height: 25px;
      --mdc-icon-size: 25px;
    }
    .hemma-tv-now-copy {
      min-width: 0;
      padding-right: 7px;
    }
    .hemma-tv-now-title,
    .hemma-tv-now-subtitle {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .hemma-tv-now-title {
      color: rgba(255,255,255,0.98);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.015em;
      line-height: 1.25;
    }
    .hemma-tv-now-subtitle {
      margin-top: 4px;
      color: rgba(255,255,255,0.58);
      font-size: 11px;
      font-weight: 550;
      line-height: 1.2;
    }
