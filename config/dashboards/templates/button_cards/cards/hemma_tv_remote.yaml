# Touch-friendly TV remote popup for tablet and desktop dashboards.
# Commands are sent to the existing Android TV remote entity.
hemma_tv_remote_visual:
  template: hemma_default
  show_icon: false
  show_name: false
  show_label: false
  label: '[[[ return variables.label || ""; ]]]'
  tooltip: '[[[ return variables.label || ""; ]]]'
  variables:
    primary: false
    accent: ''

  styles:
    card:
      - width: 72px
      - height: 72px
      - padding: 6px
      - border-radius: 18px
      - background: >-
          [[[
            return variables.primary ? '#f5f5f7' : 'rgba(255,255,255,0.09)';
          ]]]
      - color: >-
          [[[
            return variables.primary
              ? '#1d1d1f'
              : (variables.accent || 'rgba(255,255,255,0.96)');
          ]]]
      - border: none !important
      - box-shadow: none !important
      - transition: transform 0.12s ease, background 0.12s ease
    grid:
      - grid-template-areas: '"g"'
      - grid-template-columns: 1fr
      - grid-template-rows: 1fr
    custom_fields:
      g:
        - grid-area: g
        - align-self: center
        - justify-self: center
        - line-height: 1
        - font-size: 26px
        - font-weight: 500
        - color: >-
            [[[
              return variables.primary
                ? '#1d1d1f'
                : (variables.accent || 'rgba(255,255,255,0.96)');
            ]]]
    label:
      - grid-area: l
      - align-self: end
      - justify-self: center
      - color: rgba(255,255,255,0.72)
      - font-size: 10px
      - font-weight: 600
      - letter-spacing: 0.01em
      - line-height: 1.1

  custom_fields:
    g: >-
      [[[ return `<span aria-label="${variables.label || ''}">${variables.glyph || ''}</span>`; ]]]

  extra_styles: |
    ha-card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: rgba(255,255,255,0.10);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    ha-card:hover::before,
    ha-card:focus-within::before {
      opacity: 1;
    }
    ha-icon {
      --mdc-icon-size: 26px;
      width: 26px;
      height: 26px;
    }
    img {
      width: 30px;
      height: 30px;
      display: block;
    }
    ha-card:active {
      transform: scale(0.94) !important;
    }

hemma_tv_remote_button:
  template: hemma_tv_remote_visual
  tap_action:
    haptic: light
    action: call-service
    service: remote.send_command
    target:
      entity_id: '[[[ return variables.remote_entity || "remote.living_room_tv"; ]]]'
    data:
      command: '[[[ return variables.command || ""; ]]]'
  hold_action:
    action: none
  double_tap_action:
    action: none

hemma_tv_volume_button:
  template: hemma_tv_remote_button
  tap_action:
    haptic: light
    action: call-service
    service: remote.send_command
    target:
      entity_id: '[[[ return variables.remote_entity || "remote.living_room_tv"; ]]]'
    data:
      command: '[[[ return variables.command || "VOLUME_UP"; ]]]'
  hold_action:
    action: none

hemma_tv_mute_button:
  template: hemma_tv_remote_button
  tap_action:
    haptic: light
    action: call-service
    service: remote.send_command
    target:
      entity_id: '[[[ return variables.remote_entity || "remote.living_room_tv"; ]]]'
    data:
      command: '[[[ return variables.command || "MUTE"; ]]]'
  hold_action:
    action: none

# Keep app shortcuts on the visual-only base: inheriting the remote button
# would merge data.command into media_player.play_media.
hemma_tv_app_button:
  template: hemma_tv_remote_visual
  entity: media_player.living_room_tv_2
  tap_action:
    haptic: light
    action: call-service
    service: media_player.play_media
    target:
      entity_id: media_player.living_room_tv_2
    data:
      media_content_type: app
      media_content_id: '[[[ return variables.app_id || ""; ]]]'
  hold_action:
    action: more-info

hemma_tv_remote_panel:
  template: hemma_default
  entity: '[[[ return variables.volume_entity || "media_player.living_room_tv_2"; ]]]'
  show_icon: false
  show_state: false
  show_label: false
  show_name: false
  variables:
    remote_entity: remote.living_room_tv
    volume_entity: media_player.living_room_tv_2

  tap_action:
    action: none
  hold_action:
    action: none

  styles:
    card:
      - width: calc(var(--popup-min-width, 360px) - 32px)
      - max-width: 100%
      - min-height: 318px
      - padding: 0
      - box-sizing: border-box
      - border-radius: 0
      - background: transparent !important
      - box-shadow: none !important
      - border: none !important
    grid:
      - grid-template-areas: '"volume back home pause" "volume jellyfin up youtube" "volume left select right" "volume . down ."'
      - grid-template-columns: repeat(4, 72px)
      - grid-template-rows: repeat(4, 72px)
      - column-gap: 10px
      - row-gap: 10px
      - justify-content: center
    custom_fields:
      back:
        - grid-area: back
        - align-self: center
        - justify-self: center
      home:
        - grid-area: home
        - align-self: center
        - justify-self: center
      up:
        - grid-area: up
        - align-self: center
        - justify-self: center
      pause:
        - grid-area: pause
        - align-self: center
        - justify-self: center
      left:
        - grid-area: left
        - align-self: center
        - justify-self: center
      select:
        - grid-area: select
        - align-self: center
        - justify-self: center
      right:
        - grid-area: right
        - align-self: center
        - justify-self: center
      down:
        - grid-area: down
        - align-self: center
        - justify-self: center
      volume:
        - grid-area: volume
        - align-self: stretch
        - justify-self: center
      jellyfin:
        - grid-area: jellyfin
        - align-self: center
        - justify-self: center
      youtube:
        - grid-area: youtube
        - align-self: center
        - justify-self: center

  custom_fields:
    back:
      card:
        type: custom:button-card
        template: hemma_tv_remote_button
        variables:
          remote_entity: '[[[ return variables.remote_entity; ]]]'
          command: BACK
          glyph: '<ha-icon icon="mdi:arrow-left"></ha-icon>'
          label: Back
    home:
      card:
        type: custom:button-card
        template: hemma_tv_remote_button
        variables:
          remote_entity: '[[[ return variables.remote_entity; ]]]'
          command: HOME
          glyph: '<ha-icon icon="mdi:home-outline"></ha-icon>'
          label: Home
    up:
      card:
        type: custom:button-card
        template: hemma_tv_remote_button
        variables:
          remote_entity: '[[[ return variables.remote_entity; ]]]'
          command: DPAD_UP
          glyph: '<ha-icon icon="mdi:chevron-up"></ha-icon>'
          label: Up
    pause:
      card:
        type: custom:button-card
        template: hemma_tv_remote_button
        variables:
          remote_entity: '[[[ return variables.remote_entity; ]]]'
          command: MEDIA_PLAY_PAUSE
          glyph: '<ha-icon icon="mdi:play-pause"></ha-icon>'
          label: Play/Pause
    left:
      card:
        type: custom:button-card
        template: hemma_tv_remote_button
        variables:
          remote_entity: '[[[ return variables.remote_entity; ]]]'
          command: DPAD_LEFT
          glyph: '<ha-icon icon="mdi:chevron-left"></ha-icon>'
          label: Left
    select:
      card:
        type: custom:button-card
        template: hemma_tv_remote_button
        variables:
          remote_entity: '[[[ return variables.remote_entity; ]]]'
          command: DPAD_CENTER
          glyph: '●'
          label: Select
          primary: true
    right:
      card:
        type: custom:button-card
        template: hemma_tv_remote_button
        variables:
          remote_entity: '[[[ return variables.remote_entity; ]]]'
          command: DPAD_RIGHT
          glyph: '<ha-icon icon="mdi:chevron-right"></ha-icon>'
          label: Right
    down:
      card:
        type: custom:button-card
        template: hemma_tv_remote_button
        variables:
          remote_entity: '[[[ return variables.remote_entity; ]]]'
          command: DPAD_DOWN
          glyph: '<ha-icon icon="mdi:chevron-down"></ha-icon>'
          label: Down
    volume: >-
      [[[
        const entityId = variables.volume_entity || 'media_player.living_room_tv_2';
        const player = states[entityId];
        const maxVolume = 60;
        const level = Math.round(Math.max(0, Math.min(maxVolume, Number(player?.attributes?.volume_level ?? 0) * 100)));
        const fill = Math.round((level / maxVolume) * 100);
        const muted = Boolean(player?.attributes?.is_volume_muted);

        window.hemmaTvVolume = window.hemmaTvVolume || {};
        window.hemmaTvVolume.hass = hass;
        window.hemmaTvVolume.input = (slider, id) => {
          const maximum = Number(slider.max) || 60;
          const value = Math.max(0, Math.min(maximum, Number(slider.value)));
          const control = slider.closest('.hemma-tv-volume');
          if (control) {
            control.style.setProperty('--volume-level', `${(value / maximum) * 100}%`);
            const readout = control.querySelector('.hemma-tv-volume-value');
            if (readout) readout.textContent = `${Math.round(value)}%`;
            control.classList.add('is-adjusting');
          }
          clearTimeout(slider._hemmaVolumeTimer);
          slider._hemmaVolumeTimer = setTimeout(() => {
            window.hemmaTvVolume.hass.callService('media_player', 'volume_set', {
              entity_id: id,
              volume_level: value / 100,
            });
          }, 140);
        };
        window.hemmaTvVolume.commit = (slider) => {
          clearTimeout(slider._hemmaVolumeTimer);
          const maximum = Number(slider.max) || 60;
          const value = Math.max(0, Math.min(maximum, Number(slider.value)));
          window.hemmaTvVolume.hass.callService('media_player', 'volume_set', {
            entity_id: slider.dataset.entity,
            volume_level: value / 100,
          });
          slider.closest('.hemma-tv-volume')?.classList.remove('is-adjusting');
        };
        window.hemmaTvVolume.step = (button, id, delta) => {
          const control = button.closest('.hemma-tv-volume');
          const slider = control?.querySelector('.hemma-tv-volume-range');
          if (!slider) return;
          const maximum = Number(slider.max) || 60;
          const value = Math.max(0, Math.min(maximum, Number(slider.value) + delta));
          slider.value = String(value);
          control.style.setProperty('--volume-level', `${(value / maximum) * 100}%`);
          const readout = control.querySelector('.hemma-tv-volume-value');
          if (readout) readout.textContent = `${Math.round(value)}%`;
          control.classList.add('is-adjusting');
          clearTimeout(control._hemmaReadoutTimer);
          control._hemmaReadoutTimer = setTimeout(() => control.classList.remove('is-adjusting'), 650);
          window.hemmaTvVolume.hass.callService('media_player', 'volume_set', {
            entity_id: id,
            volume_level: value / 100,
          });
        };
        window.hemmaTvVolume.mute = (button, id) => {
          const nextMuted = button.getAttribute('aria-pressed') !== 'true';
          window.hemmaTvVolume.hass.callService('media_player', 'volume_mute', {
            entity_id: id,
            is_volume_muted: nextMuted,
          });
        };

        return `
          <div class="hemma-tv-volume${muted ? ' is-muted' : ''}" style="--volume-level:${fill}%">
            <button
              class="hemma-tv-volume-button hemma-tv-volume-up"
              type="button"
              aria-label="Increase TV volume by 1 percent"
              onclick="event.stopPropagation(); window.hemmaTvVolume.step(this, '${entityId}', 1)"
            >
              <ha-icon icon="mdi:plus"></ha-icon>
            </button>
            <div class="hemma-tv-volume-glass">
              <div class="hemma-tv-volume-fill"></div>
              <div class="hemma-tv-volume-value" aria-hidden="true">${level}%</div>
              <input
                class="hemma-tv-volume-range"
                type="range"
                min="0"
                max="60"
                step="1"
                value="${level}"
                data-entity="${entityId}"
                aria-label="TV volume"
                aria-valuetext="${level} percent"
                oninput="window.hemmaTvVolume.input(this, this.dataset.entity)"
                onchange="window.hemmaTvVolume.commit(this)"
                onpointerup="this.closest('.hemma-tv-volume')?.classList.remove('is-adjusting')"
              >
            </div>
            <button
              class="hemma-tv-volume-button hemma-tv-volume-down"
              type="button"
              aria-label="Decrease TV volume by 1 percent"
              onclick="event.stopPropagation(); window.hemmaTvVolume.step(this, '${entityId}', -1)"
            >
              <ha-icon icon="mdi:minus"></ha-icon>
            </button>
            <button
              class="hemma-tv-volume-button hemma-tv-volume-mute"
              type="button"
              aria-label="${muted ? 'Unmute TV' : 'Mute TV'}"
              aria-pressed="${muted}"
              onclick="event.stopPropagation(); window.hemmaTvVolume.mute(this, '${entityId}')"
            >
              <ha-icon icon="mdi:${muted ? 'volume-off' : level < 34 ? 'volume-low' : level < 67 ? 'volume-medium' : 'volume-high'}"></ha-icon>
            </button>
          </div>`;
      ]]]
    jellyfin:
      card:
        type: custom:button-card
        template: hemma_tv_app_button
        variables:
          app_id: com.sony.dtv.com.github.damontecres.wholphin.com.github.damontecres.wholphin.MainActivity
          glyph: '<img src="/local/hemma/icons/jellyfin-purple.svg" alt="Jellyfin">'
          label: Jellyfin
          accent: 'var(--hemma-color-purple, #9333ea)'
    youtube:
      card:
        type: custom:button-card
        template: hemma_tv_app_button
        variables:
          app_id: com.sony.dtv.com.google.android.youtube.tv.com.google.android.apps.youtube.tv.activity.ShellActivity
          glyph: '<ha-icon icon="mdi:youtube"></ha-icon>'
          label: YouTube
          accent: '#ff453a'

  extra_styles: |
    :host {
      display: block !important;
      width: calc(var(--popup-min-width, 360px) - 32px) !important;
      max-width: 100% !important;
      margin-left: auto !important;
      margin-right: 0 !important;
    }
    ha-card {
      overflow: visible !important;
    }
    .hemma-tv-volume {
      --volume-level: 0%;
      width: 72px;
      height: 318px;
      padding: 0;
      box-sizing: border-box;
      border-radius: 18px;
      display: grid;
      grid-template-rows: 44px minmax(0, 1fr) 44px 44px;
      gap: 6px;
      background: transparent;
      border: 0;
      box-shadow: none;
      overflow: visible;
      position: relative;
    }
    .hemma-tv-volume-glass {
      position: relative;
      min-height: 0;
      width: 72px;
      border-radius: 18px;
      overflow: hidden;
      background: rgba(255,255,255,0.09);
      box-shadow: none;
    }
    .hemma-tv-volume-fill {
      position: absolute;
      inset: auto 0 0;
      height: var(--volume-level);
      border-radius: 18px;
      background: rgba(245,245,247,0.96);
      box-shadow: none;
      transition: height 100ms ease-out;
      pointer-events: none;
    }
    .hemma-tv-volume-range {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      opacity: 0;
      cursor: ns-resize;
      writing-mode: vertical-lr;
      direction: rtl;
      touch-action: none;
      z-index: 5;
    }
    .hemma-tv-volume-value {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 5px 7px;
      border-radius: 9px;
      color: rgba(255,255,255,0.96);
      background: rgba(0,0,0,0.34);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: -0.01em;
      opacity: 0;
      transition: opacity 120ms ease;
      pointer-events: none;
      z-index: 4;
    }
    .hemma-tv-volume.is-adjusting .hemma-tv-volume-value {
      opacity: 1;
    }
    .hemma-tv-volume.is-muted .hemma-tv-volume-fill {
      opacity: 0.28;
    }
    .hemma-tv-volume-button {
      width: 72px;
      height: 44px;
      justify-self: center;
      align-self: center;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 14px;
      color: rgba(255,255,255,0.94);
      background: rgba(255,255,255,0.09);
      box-shadow: none;
      cursor: pointer;
      position: relative;
      z-index: 5;
      -webkit-tap-highlight-color: transparent;
    }
    .hemma-tv-volume-button:active {
      transform: scale(0.94);
      background: rgba(255,255,255,0.16);
    }
    .hemma-tv-volume-button ha-icon {
      width: 24px;
      height: 24px;
      --mdc-icon-size: 24px;
    }
    .hemma-tv-volume.is-muted .hemma-tv-volume-mute {
      color: #ff453a;
      background: rgba(255,69,58,0.15);
    }
