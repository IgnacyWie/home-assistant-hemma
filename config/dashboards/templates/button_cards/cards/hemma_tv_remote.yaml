# Touch-friendly TV remote popup for tablet and desktop dashboards.
# Commands are sent to the existing Android TV remote entity.
hemma_tv_remote_visual:
  template: hemma_default
  show_icon: false
  show_name: false
  show_label: false
  label: '[[[ return variables.label || ""; ]]]'
  tooltip: '[[[ return variables.label || ""; ]]]'
  variables:
    primary: false
    accent: ''

  styles:
    card:
      - width: 72px
      - height: 72px
      - padding: 6px
      - border-radius: 18px
      - background: >-
          [[[
            return variables.primary ? '#f5f5f7' : 'rgba(255,255,255,0.09)';
          ]]]
      - color: >-
          [[[
            return variables.primary
              ? '#1d1d1f'
              : (variables.accent || 'rgba(255,255,255,0.96)');
          ]]]
      - border: none !important
      - box-shadow: none !important
      - transition: transform 0.12s ease, background 0.12s ease
    grid:
      - grid-template-areas: '"g"'
      - grid-template-columns: 1fr
      - grid-template-rows: 1fr
    custom_fields:
      g:
        - grid-area: g
        - align-self: center
        - justify-self: center
        - line-height: 1
        - font-size: 26px
        - font-weight: 500
        - color: >-
            [[[
              return variables.primary
                ? '#1d1d1f'
                : (variables.accent || 'rgba(255,255,255,0.96)');
            ]]]
    label:
      - grid-area: l
      - align-self: end
      - justify-self: center
      - color: rgba(255,255,255,0.72)
      - font-size: 10px
      - font-weight: 600
      - letter-spacing: 0.01em
      - line-height: 1.1

  custom_fields:
    g: >-
      [[[ return `<span aria-label="${variables.label || ''}">${variables.glyph || ''}</span>`; ]]]

  extra_styles: |
    ha-card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: rgba(255,255,255,0.10);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.12s ease;
    }
    ha-card:hover::before,
    ha-card:focus-within::before {
      opacity: 1;
    }
    ha-icon {
      --mdc-icon-size: 26px;
      width: 26px;
      height: 26px;
    }
    img {
      width: 30px;
      height: 30px;
      display: block;
    }
    ha-card:active {
      transform: scale(0.94) !important;
    }

hemma_tv_remote_button:
  template: hemma_tv_remote_visual
  tap_action:
    haptic: light
    action: call-service
    service: remote.send_command
    target:
      entity_id: '[[[ return variables.remote_entity || "remote.living_room_tv"; ]]]'
    data:
      command: '[[[ return variables.command || ""; ]]]'
  hold_action:
    action: none
  double_tap_action:
    action: none

hemma_tv_volume_button:
  template: hemma_tv_remote_button
  tap_action:
    haptic: light
    action: call-service
    service: remote.send_command
    target:
      entity_id: '[[[ return variables.remote_entity || "remote.living_room_tv"; ]]]'
    data:
      command: '[[[ return variables.command || "VOLUME_UP"; ]]]'
  hold_action:
    action: none

hemma_tv_mute_button:
  template: hemma_tv_remote_button
  tap_action:
    haptic: light
    action: call-service
    service: remote.send_command
    target:
      entity_id: '[[[ return variables.remote_entity || "remote.living_room_tv"; ]]]'
    data:
      command: '[[[ return variables.command || "MUTE"; ]]]'
  hold_action:
    action: none

# Keep app shortcuts on the visual-only base: inheriting the remote button
# would merge data.command into media_player.play_media.
hemma_tv_app_button:
  template: hemma_tv_remote_visual
  entity: media_player.living_room_tv_2
  tap_action:
    haptic: light
    action: call-service
    service: media_player.play_media
    target:
      entity_id: media_player.living_room_tv_2
    data:
      media_content_type: app
      media_content_id: '[[[ return variables.app_id || ""; ]]]'
  hold_action:
    action: more-info

# App launchers stay visually compact so the popup remains a remote first.
hemma_tv_hub_shortcut:
  template: hemma_tv_app_button
  styles:
    card:
      - width: 58px
      - height: 50px
      - padding: 4px
      - border-radius: 15px
    custom_fields:
      g:
        - font-size: 22px
  extra_styles: |
    ha-icon {
      --mdc-icon-size: 24px;
      width: 24px;
      height: 24px;
    }
    img {
      width: 27px;
      height: 27px;
      object-fit: contain;
    }

hemma_tv_cinema_button:
  template: hemma_tv_remote_visual
  tap_action:
    haptic: medium
    action: call-service
    service: script.hemma_tv_cinema
  hold_action:
    action: none
  styles:
    card:
      - width: 58px
      - height: 50px
      - padding: 4px
      - border-radius: 15px
      - background: rgba(255,69,58,0.15)
      - color: '#ff6b63'
    custom_fields:
      g:
        - font-size: 22px
        - color: '#ff6b63'

hemma_tv_resume_button:
  template: hemma_tv_remote_visual
  entity: '[[[ return variables.playback_entity || "media_player.tv_w_salonie_4"; ]]]'
  tap_action:
    haptic: light
    action: call-service
    service: media_player.media_play
    target:
      entity_id: '[[[ return variables.playback_entity || "media_player.tv_w_salonie_4"; ]]]'
  hold_action:
    action: more-info
  styles:
    card:
      - width: 116px
      - height: 50px
      - padding: 4px 10px
      - border-radius: 15px
      - background: rgba(147,51,234,0.18)
      - color: rgba(255,255,255,0.98)
    custom_fields:
      g:
        - font-size: 12px
        - font-weight: 700
        - letter-spacing: -0.01em
        - white-space: nowrap
  custom_fields:
    g: '<span class="hemma-tv-resume"><ha-icon icon="mdi:play"></ha-icon>Resume</span>'
  extra_styles: |
    .hemma-tv-resume {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .hemma-tv-resume ha-icon {
      width: 20px;
      height: 20px;
      --mdc-icon-size: 20px;
    }

hemma_tv_spotify_button:
  template: hemma_tv_remote_visual
  entity: media_player.spotify_ignacy
  tap_action:
    haptic: light
    action: call-service
    service: media_player.select_source
    target:
      entity_id: media_player.spotify_ignacy
    data:
      source: >-
        [[[
          const sources = states['media_player.spotify_ignacy']?.attributes?.source_list || [];
          return sources.find(source => /\btv\b|bravia|sony/i.test(source)) || '';
        ]]]
  hold_action:
    action: more-info
  styles:
    card:
      - width: 58px
      - height: 50px
      - padding: 4px
      - border-radius: 15px
      - color: '#1ed760'

hemma_tv_launcher_strip:
  template: hemma_default
  entity: media_player.living_room_tv
  triggers_update:
    - media_player.living_room_tv
    - media_player.living_room_tv_2
    - media_player.tv_w_salonie_4
    - media_player.spotify_ignacy
  show_icon: false
  show_name: false
  show_state: false
  show_label: false
  tap_action:
    action: none
  hold_action:
    action: none
  styles:
    card:
      - width: 318px
      - height: 50px
      - padding: 0
      - border-radius: 0
      - background: transparent !important
      - border: none !important
      - box-shadow: none !important
      - overflow: visible
      - display: >-
          [[[
            const state = states['media_player.living_room_tv_2']?.state;
            return ['off', 'unknown', 'unavailable'].includes(state) ? 'none' : 'block';
          ]]]
    grid:
      - display: flex
      - align-items: center
      - justify-content: flex-start
      - gap: 7px
      - width: 318px
      - height: 50px
    custom_fields:
      resume:
        - flex: 0 0 auto
        - display: >-
            [[[
              const playback = states['media_player.tv_w_salonie_4'];
              return playback?.state === 'paused' && playback.attributes?.media_title ? 'block' : 'none';
            ]]]
        - order: 0
      jellyfin:
        - flex: 0 0 auto
        - display: >-
            [[[
              const playback = states['media_player.tv_w_salonie_4'];
              return playback?.state === 'paused' && playback.attributes?.media_title ? 'none' : 'block';
            ]]]
        - order: >-
            [[[
              const player = states['media_player.living_room_tv'];
              const app = `${player?.attributes?.app_name || ''} ${player?.attributes?.app_id || ''}`.toLowerCase();
              return /wholphin|jellyfin/.test(app) ? 1 : 10;
            ]]]
      youtube:
        - flex: 0 0 auto
        - order: >-
            [[[
              const player = states['media_player.living_room_tv'];
              const app = `${player?.attributes?.app_name || ''} ${player?.attributes?.app_id || ''}`.toLowerCase();
              return app.includes('youtube') ? 1 : 11;
            ]]]
      spotify:
        - flex: 0 0 auto
        - display: >-
            [[[
              const spotify = states['media_player.spotify_ignacy'];
              const sources = spotify?.attributes?.source_list || [];
              return sources.some(source => /\btv\b|bravia|sony/i.test(source)) ? 'block' : 'none';
            ]]]
        - order: >-
            [[[
              const player = states['media_player.living_room_tv'];
              const app = `${player?.attributes?.app_name || ''} ${player?.attributes?.app_id || ''}`.toLowerCase();
              return app.includes('spotify') ? 1 : 12;
            ]]]
      cinema:
        - flex: 0 0 auto
        - order: 30
  custom_fields:
    resume:
      card:
        type: custom:button-card
        template: hemma_tv_resume_button
        variables:
          playback_entity: media_player.tv_w_salonie_4
    jellyfin:
      card:
        type: custom:button-card
        template: hemma_tv_hub_shortcut
        variables:
          app_id: com.sony.dtv.com.github.damontecres.wholphin.com.github.damontecres.wholphin.MainActivity
          glyph: '<img src="/local/hemma/icons/jellyfin-purple.svg" alt="Jellyfin">'
          label: Jellyfin
          accent: 'var(--hemma-color-purple, #9333ea)'
    youtube:
      card:
        type: custom:button-card
        template: hemma_tv_hub_shortcut
        variables:
          app_id: com.sony.dtv.com.google.android.youtube.tv.com.google.android.apps.youtube.tv.activity.ShellActivity
          glyph: '<ha-icon icon="mdi:youtube"></ha-icon>'
          label: YouTube
          accent: '#ff453a'
    spotify:
      card:
        type: custom:button-card
        template: hemma_tv_spotify_button
        variables:
          glyph: '<ha-icon icon="mdi:spotify"></ha-icon>'
          label: Spotify
    cinema:
      card:
        type: custom:button-card
        template: hemma_tv_cinema_button
        variables:
          glyph: '<ha-icon icon="mdi:movie-open"></ha-icon>'
          label: Cinema

# Use native button-card actions for volume steps. Raw HTML onclick handlers
# inside a custom field are not reliable in the iOS Home Assistant WebView.
hemma_tv_volume_step_button:
  template: hemma_default
  entity: '[[[ return variables.volume_entity || "media_player.living_room_tv_2"; ]]]'
  show_icon: false
  show_name: false
  show_label: false
  variables:
    volume_entity: media_player.living_room_tv_2
    delta: 0.01
    glyph: mdi:plus
    label: Adjust TV volume
  tap_action:
    haptic: light
    action: call-service
    service: media_player.volume_set
    target:
      entity_id: '[[[ return variables.volume_entity; ]]]'
    data:
      volume_level: >-
        [[[
          const player = states[variables.volume_entity];
          const current = Number(player?.attributes?.volume_level ?? 0);
          const delta = Number(variables.delta ?? 0);
          return Math.max(0, Math.min(0.6, Math.round((current + delta) * 100) / 100));
        ]]]
  hold_action:
    action: none
  double_tap_action:
    action: none
  styles:
    card:
      - width: 72px
      - height: 44px
      - padding: 0
      - border-radius: 14px
      - background: rgba(255,255,255,0.09)
      - color: rgba(255,255,255,0.94)
      - border: none !important
      - box-shadow: none !important
      - transition: transform 0.12s ease, background 0.12s ease
    grid:
      - grid-template-areas: '"g"'
      - grid-template-columns: 1fr
      - grid-template-rows: 1fr
    custom_fields:
      g:
        - grid-area: g
        - align-self: center
        - justify-self: center
        - line-height: 1
  custom_fields:
    g: >-
      [[[ return `<ha-icon icon="${variables.glyph}" aria-label="${variables.label}"></ha-icon>`; ]]]
  extra_styles: |
    ha-icon {
      width: 24px;
      height: 24px;
      --mdc-icon-size: 24px;
    }
    ha-card:active {
      transform: scale(0.94) !important;
      background: rgba(255,255,255,0.16) !important;
    }

hemma_tv_volume_mute_button:
  template: hemma_tv_volume_step_button
  variables:
    volume_entity: media_player.living_room_tv_2
    label: Mute TV
  tap_action:
    haptic: light
    action: call-service
    service: media_player.volume_mute
    target:
      entity_id: '[[[ return variables.volume_entity; ]]]'
    data:
      is_volume_muted: >-
        [[[
          return !Boolean(states[variables.volume_entity]?.attributes?.is_volume_muted);
        ]]]
  custom_fields:
    g: >-
      [[[
        const muted = Boolean(states[variables.volume_entity]?.attributes?.is_volume_muted);
        return `<ha-icon icon="mdi:${muted ? 'volume-off' : 'volume-high'}" aria-label="${muted ? 'Unmute TV' : 'Mute TV'}"></ha-icon>`;
      ]]]
  styles:
    card:
      - color: >-
          [[[
            return states[variables.volume_entity]?.attributes?.is_volume_muted
              ? '#ff453a'
              : 'rgba(255,255,255,0.94)';
          ]]]
      - background: >-
          [[[
            return states[variables.volume_entity]?.attributes?.is_volume_muted
              ? 'rgba(255,69,58,0.15)'
              : 'rgba(255,255,255,0.09)';
          ]]]

hemma_tv_volume_control:
  template: hemma_default
  entity: '[[[ return variables.volume_entity || "media_player.living_room_tv_2"; ]]]'
  show_icon: false
  show_name: false
  show_label: false
  show_state: false
  variables:
    volume_entity: media_player.living_room_tv_2
  tap_action:
    action: none
  hold_action:
    action: none
  styles:
    card:
      - width: 72px
      - height: 318px
      - padding: 0
      - border-radius: 18px
      - background: transparent !important
      - border: none !important
      - box-shadow: none !important
      - overflow: visible
    grid:
      - grid-template-areas: '"up" "slider" "down" "mute"'
      - grid-template-columns: 72px
      - grid-template-rows: 44px minmax(0, 1fr) 44px 44px
      - row-gap: 6px
    custom_fields:
      up:
        - grid-area: up
      slider:
        - grid-area: slider
        - min-height: 0
      down:
        - grid-area: down
      mute:
        - grid-area: mute
  custom_fields:
    up:
      card:
        type: custom:button-card
        template: hemma_tv_volume_step_button
        variables:
          volume_entity: '[[[ return variables.volume_entity; ]]]'
          delta: 0.01
          glyph: mdi:plus
          label: Increase TV volume by 1 percent
    slider: >-
      [[[
        const entityId = variables.volume_entity || 'media_player.living_room_tv_2';
        const player = states[entityId];
        const maxVolume = 60;
        const level = Math.round(Math.max(0, Math.min(maxVolume, Number(player?.attributes?.volume_level ?? 0) * 100)));
        const fill = Math.round((level / maxVolume) * 100);

        window.hemmaTvVolume = window.hemmaTvVolume || {};
        window.hemmaTvVolume.hass = hass;
        window.hemmaTvVolume.input = (slider, id) => {
          const maximum = Number(slider.max) || 60;
          const value = Math.max(0, Math.min(maximum, Number(slider.value)));
          const control = slider.closest('.hemma-tv-volume-glass');
          if (control) {
            control.style.setProperty('--volume-level', `${(value / maximum) * 100}%`);
            const readout = control.querySelector('.hemma-tv-volume-value');
            if (readout) readout.textContent = `${Math.round(value)}%`;
            control.classList.add('is-adjusting');
          }
          clearTimeout(slider._hemmaVolumeTimer);
          slider._hemmaVolumeTimer = setTimeout(() => {
            window.hemmaTvVolume.hass.callService('media_player', 'volume_set', {
              entity_id: id,
              volume_level: value / 100,
            });
          }, 140);
        };
        window.hemmaTvVolume.commit = (slider) => {
          clearTimeout(slider._hemmaVolumeTimer);
          const maximum = Number(slider.max) || 60;
          const value = Math.max(0, Math.min(maximum, Number(slider.value)));
          window.hemmaTvVolume.hass.callService('media_player', 'volume_set', {
            entity_id: slider.dataset.entity,
            volume_level: value / 100,
          });
          slider.closest('.hemma-tv-volume-glass')?.classList.remove('is-adjusting');
        };

        return `
          <div class="hemma-tv-volume-glass" style="--volume-level:${fill}%">
            <div class="hemma-tv-volume-fill"></div>
            <div class="hemma-tv-volume-value" aria-hidden="true">${level}%</div>
            <input
              class="hemma-tv-volume-range"
              type="range"
              min="0"
              max="60"
              step="1"
              value="${level}"
              data-entity="${entityId}"
              aria-label="TV volume"
              aria-valuetext="${level} percent"
              oninput="window.hemmaTvVolume.input(this, this.dataset.entity)"
              onchange="window.hemmaTvVolume.commit(this)"
              onpointerup="this.closest('.hemma-tv-volume-glass')?.classList.remove('is-adjusting')"
            >
          </div>`;
      ]]]
    down:
      card:
        type: custom:button-card
        template: hemma_tv_volume_step_button
        variables:
          volume_entity: '[[[ return variables.volume_entity; ]]]'
          delta: -0.01
          glyph: mdi:minus
          label: Decrease TV volume by 1 percent
    mute:
      card:
        type: custom:button-card
        template: hemma_tv_volume_mute_button
        variables:
          volume_entity: '[[[ return variables.volume_entity; ]]]'
  extra_styles: |
    .hemma-tv-volume-glass {
      --volume-level: 0%;
      position: relative;
      width: 72px;
      height: 100%;
      min-height: 0;
      border-radius: 18px;
      overflow: hidden;
      background: rgba(255,255,255,0.09);
      box-shadow: none;
    }
    .hemma-tv-volume-fill {
      position: absolute;
      inset: auto 0 0;
      height: var(--volume-level);
      border-radius: 18px;
      background: rgba(245,245,247,0.96);
      box-shadow: none;
      transition: height 100ms ease-out;
      pointer-events: none;
    }
    .hemma-tv-volume-range {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      opacity: 0;
      cursor: ns-resize;
      writing-mode: vertical-lr;
      direction: rtl;
      touch-action: none;
      z-index: 5;
    }
    .hemma-tv-volume-value {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 5px 7px;
      border-radius: 9px;
      color: rgba(255,255,255,0.96);
      background: rgba(0,0,0,0.34);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: -0.01em;
      opacity: 0;
      transition: opacity 120ms ease;
      pointer-events: none;
      z-index: 4;
    }
    .hemma-tv-volume-glass.is-adjusting .hemma-tv-volume-value {
      opacity: 1;
    }

hemma_tv_remote_panel:
  template: hemma_default
  entity: '[[[ return variables.playback_entity || "media_player.tv_w_salonie_4"; ]]]'
  show_icon: false
  show_state: false
  show_label: false
  show_name: false
  variables:
    remote_entity: remote.living_room_tv
    volume_entity: media_player.living_room_tv_2
    playback_entity: media_player.tv_w_salonie_4
  triggers_update:
    - media_player.living_room_tv
    - media_player.living_room_tv_2
    - media_player.tv_w_salonie_4
    - media_player.spotify_ignacy

  tap_action:
    action: none
  hold_action:
    action: none

  styles:
    card:
      - width: calc(var(--popup-min-width, 360px) - 32px)
      - max-width: 100%
      - min-height: >-
          [[[
            const state = states['media_player.living_room_tv_2']?.state;
            return ['off', 'unknown', 'unavailable'].includes(state) ? '408px' : '458px';
          ]]]
      - padding: 0
      - box-sizing: border-box
      - border-radius: 0
      - background: transparent !important
      - box-shadow: none !important
      - border: none !important
    grid:
      - grid-template-areas: '"media media media media" "launchers launchers launchers launchers" "volume back home pause" "volume . up ." "volume left select right" "volume . down ."'
      - grid-template-columns: repeat(4, 72px)
      - grid-template-rows: >-
          [[[
            const state = states['media_player.living_room_tv_2']?.state;
            return ['off', 'unknown', 'unavailable'].includes(state)
              ? '70px 0px repeat(4, 72px)'
              : '70px 50px repeat(4, 72px)';
          ]]]
      - column-gap: 10px
      - row-gap: 10px
      - justify-content: center
    custom_fields:
      media:
        - grid-area: media
        - align-self: stretch
        - justify-self: stretch
      launchers:
        - grid-area: launchers
        - align-self: center
        - justify-self: center
      back:
        - grid-area: back
        - align-self: center
        - justify-self: center
      home:
        - grid-area: home
        - align-self: center
        - justify-self: center
      up:
        - grid-area: up
        - align-self: center
        - justify-self: center
      pause:
        - grid-area: pause
        - align-self: center
        - justify-self: center
      left:
        - grid-area: left
        - align-self: center
        - justify-self: center
      select:
        - grid-area: select
        - align-self: center
        - justify-self: center
      right:
        - grid-area: right
        - align-self: center
        - justify-self: center
      down:
        - grid-area: down
        - align-self: center
        - justify-self: center
      volume:
        - grid-area: volume
        - align-self: stretch
        - justify-self: center

  custom_fields:
    media: >-
      [[[
        const id = variables.playback_entity || 'media_player.tv_w_salonie_4';
        const player = states[id];
        const a = player?.attributes || {};
        const active = ['playing', 'paused', 'buffering'].includes(player?.state);
        const title = active ? (a.media_title || a.media_series_title || a.friendly_name || 'Now Playing') : 'Living Room TV';
        const subtitle = active
          ? ([a.media_series_title, a.media_season && a.media_episode ? `${a.media_season} · ${a.media_episode}` : '', a.media_artist, a.app_name]
              .filter((value, index, all) => value && all.indexOf(value) === index && value !== title)[0] || (player.state === 'paused' ? 'Paused' : 'Playing'))
          : 'Entertainment hub';
        const picture = active
          ? (a.entity_picture_local || a.entity_picture || a.media_image_url || a.media_album_cover_url || a.image_url || '')
          : '';
        const esc = value => String(value ?? '')
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        const image = picture
          ? `<img class="hemma-tv-now-art" src="${esc(picture)}" alt="" onerror="this.style.display='none'">`
          : `<span class="hemma-tv-now-fallback"><ha-icon icon="mdi:television-play"></ha-icon></span>`;
        return `<div class="hemma-tv-now${active ? ' is-active' : ''}">${image}<div class="hemma-tv-now-copy"><div class="hemma-tv-now-title">${esc(title)}</div><div class="hemma-tv-now-subtitle">${esc(subtitle)}</div></div></div>`;
      ]]]
    launchers:
      card:
        type: custom:button-card
        template: hemma_tv_launcher_strip
    back:
      card:
        type: custom:button-card
        template: hemma_tv_remote_button
        variables:
          remote_entity: '[[[ return variables.remote_entity; ]]]'
          command: BACK
          glyph: '<ha-icon icon="mdi:arrow-left"></ha-icon>'
          label: Back
    home:
      card:
        type: custom:button-card
        template: hemma_tv_remote_button
        variables:
          remote_entity: '[[[ return variables.remote_entity; ]]]'
          command: HOME
          glyph: '<ha-icon icon="mdi:home-outline"></ha-icon>'
          label: Home
    up:
