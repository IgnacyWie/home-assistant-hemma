button_card_templates: !include_dir_merge_named /config/dashboards/templates/button_cards

kiosk_mode:
  hide_header: true
  hide_sidebar: false
  hide_dialog_light_settings_actions: true
  hide_dialog_logbook: true

views:
  - type: custom:grid-layout
    title: Home
    path: home
    theme: Hemma
    layout: !include /config/dashboards/templates/includes/hemma_screen_layout.yaml
    cards:
      - type: custom:button-card
        template: hemma_room
        name: Home
        variables:
          image: home-apartment
          image_night: home-apartment
          preload_rooms: &room_images
            - home-apartment
            - home-demo
            - livingroom-demo
            - bedroom-demo
          weather_entity: weather.forecast_home
          presence_entity_1: person.example_user
          media_player_1: media_player.tv_w_salonie_4
          media_player_2: media_player.zeppelin
          light_entity_1: light.living_room_accent_1
          light_entity_2: light.bedroom_accent_bedroom
          light_entity_3: light.sonoff_zbminil2
          light_entity_4: light.living_room_2ch_wi_fi_switch_module_2_switch_2
          energy_power_entity: sensor.lsc_smart_power_plug_power
          energy_usage_month: sensor.lsc_smart_power_plug_monthly_energy
      - !include /config/dashboards/templates/includes/hemma_navbar_tablet.yaml
      - type: custom:hemma-smart-row
        cards:
          # Keep this stateless action first so Hemma's active-card sorting cannot
          # push it beyond the initially visible part of the horizontal rail.
          - type: custom:button-card
            template: hemma_entity
            entity: scene.welcome_home
            name: Welcome Home
            state_display: |
              [[[
                return states['binary_sensor.welcome_home_scene_active']?.state === 'on'
                  ? 'Active'
                  : 'Inactive';
              ]]]
            variables:
              icon: home
              active_override: |
                [[[
                  return states['binary_sensor.welcome_home_scene_active']?.state === 'on';
                ]]]
            tap_action:
              action: call-service
              service: scene.turn_on
              target:
                entity_id: scene.welcome_home
          - type: custom:button-card
            template: hemma_entity
            entity: scene.leave_home
            name: Leave Home
            state_display: |
              [[[
                return states['binary_sensor.leave_home_scene_active']?.state === 'on'
                  ? 'Active'
                  : 'Inactive';
              ]]]
            variables:
              icon: door-open
              active_override: |
                [[[
                  return states['binary_sensor.leave_home_scene_active']?.state === 'on';
                ]]]
            tap_action:
              action: call-service
              service: script.turn_on
              target:
                entity_id: script.leave_home
          - type: custom:button-card
            template: hemma_media
            entity: media_player.living_room_tv_2
            name: Living Room TV
            variables:
              icon: tv
              show_toggle: true
            tap_action:
              haptic: light
              action: fire-dom-event
              hemma_popup:
                title: TV Remote
                eyebrow: Living Room TV
                dismissable: true
                dismiss_on_background: true
                popup_styles:
                  - style: all
                    styles: |
                      --hemma-popup-justify: flex-end;
                      --hemma-popup-align: flex-end;
                      --hemma-popup-top: 18px;
                      --hemma-popup-right: clamp(0px, calc(100vw - 768px), 18px);
                      --hemma-popup-bottom: clamp(0px, calc(100vw - 768px), 18px);
                      --hemma-popup-radius: 28px;
                      --hemma-popup-header-gap: 2px;
                      --hemma-popup-tint: rgba(18,18,22,0.84);
                      --hemma-popup-grain: 0;
                      --hemma-popup-grain-dark: 0;
                      --popup-min-width: 360px;
                      --popup-max-width: 360px;
                content:
                  type: custom:button-card
                  template: hemma_tv_remote_panel
                  variables:
                    remote_entity: remote.living_room_tv
          - type: custom:button-card
            template: hemma_media
            entity: media_player.zeppelin
            name: Zeppelin
            variables:
              icon: zeppelin-speaker-v2
          - type: custom:button-card
            template: hemma_entity
            entity: person.example_user
            name: Resident
            variables:
              icon: iphone
          - type: custom:button-card
            template: hemma_energy
            entity: sensor.lsc_smart_power_plug_power
            name: Power
            variables:
              room_name: Home
              entity_power: sensor.lsc_smart_power_plug_power
              entity_usage_month: sensor.lsc_smart_power_plug_monthly_energy

  - type: custom:grid-layout
