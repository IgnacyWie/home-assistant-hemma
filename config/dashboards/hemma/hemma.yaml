button_card_templates: !include_dir_merge_named /config/dashboards/templates/button_cards

kiosk_mode:
  hide_header: true
  hide_sidebar: false
  hide_dialog_light_settings_actions: true
  hide_dialog_logbook: true

views:
  - type: custom:grid-layout
    title: Home
    path: home
    theme: Hemma
    layout: !include /config/dashboards/templates/includes/hemma_screen_layout.yaml
    cards:
      - type: custom:button-card
        template: hemma_room
        name: Home
        variables:
          image: home-apartment
          image_night: home-apartment
          preload_rooms: &room_images
            - home-apartment
            - home-demo
            - livingroom-demo
            - bedroom-demo
          weather_entity: weather.forecast_home
          presence_entity_1: person.ignacy_wie
          presence_battery_entity_1: sensor.phi_battery_level
          presence_icon_1: cellphone-mobile-v1
          wake_alarm_enabled_entity: input_boolean.wake_up_enabled
          wake_alarm_time_entity: input_datetime.wake_up_time
          wake_alarm_evening_only: false
          scene_entity_1: scene.welcome_home
          scene_label_1: Welcome Home
          scene_icon_1: fireplace-home-v1
          scene_active_entity_1: binary_sensor.welcome_home_scene_active
          scene_service_1: scene.turn_on
          active_devices_enabled: true
          active_devices_all_off_entity: script.leave_home
          active_device_entity_1: light.bedroom_accent_bedroom
          active_device_entity_2: light.living_room_accent_1
          active_device_entity_3: light.living_room_2ch_wi_fi_switch_module_switch_2
          active_device_entity_4: light.living_room_2ch_wi_fi_switch_module_2_switch_1
          active_device_entity_5: light.living_room_2ch_wi_fi_switch_module_2_switch_2
          active_device_entity_6: light.living_room_2ch_wi_fi_switch_module_switch_1
          active_device_entity_7: light.living_room_balcony
          active_device_entity_8: light.3_in_1_controller_wifi_2_4g
          active_device_entity_9: light.bedroom_ikea_of_sweden_grillplats_plug
          active_device_entity_10: switch.ikea_of_sweden_grillplats_plug_2
          active_device_entity_11: fan.bathroom_fan_bathroom
          active_device_entity_12: media_player.zeppelin
          active_device_entity_13: media_player.living_room_tv_2
          media_player_1: media_player.tv_w_salonie
          media_player_2: media_player.zeppelin
          light_entity_1: light.living_room_accent_1
          light_entity_2: light.bedroom_accent_bedroom
          light_entity_3: light.bathroom_led_bathroom
          light_entity_4: light.living_room_2ch_wi_fi_switch_module_2_switch_2
          energy_power_entity: sensor.lsc_smart_power_plug_power
          energy_prominence_threshold: 1000
          energy_usage_month: sensor.lsc_smart_power_plug_monthly_energy
      - !include /config/dashboards/templates/includes/hemma_navbar_tablet.yaml
      - type: custom:hemma-smart-row
        cards:
          - type: custom:button-card
            template: hemma_media
            entity: media_player.living_room_tv_2
            name: Living Room TV
            variables:
              icon: tv
              show_toggle: true
            tap_action:
              haptic: light
              action: fire-dom-event
              hemma_popup:
                title: TV Remote
                eyebrow: Living Room TV
                dismissable: true
                dismiss_on_background: true
                popup_styles:
                  - style: all
                    styles: |
                      --hemma-popup-justify: flex-end;
                      --hemma-popup-align: flex-end;
                      --hemma-popup-top: 18px;
                      --hemma-popup-right: clamp(0px, calc(100vw - 768px), 18px);
                      --hemma-popup-bottom: clamp(0px, calc(100vw - 768px), 18px);
                      --hemma-popup-radius: 28px;
                      --hemma-popup-header-gap: 2px;
                      --hemma-popup-tint: rgba(18,18,22,0.84);
                      --hemma-popup-grain: 0;
                      --hemma-popup-grain-dark: 0;
                      --popup-min-width: 360px;
                      --popup-max-width: 360px;
                content:
                  type: custom:button-card
                  template: hemma_tv_remote_panel
                  variables:
                    remote_entity: remote.living_room_tv
          - type: custom:button-card
            template: hemma_media
            entity: media_player.zeppelin
            name: Zeppelin
            variables:
              icon: zeppelin-speaker-v2

  - type: custom:grid-layout
    title: Living Room
    path: living-room
    theme: Hemma
    layout: !include /config/dashboards/templates/includes/hemma_screen_layout.yaml
    cards:
      - type: custom:button-card
        template: hemma_room
        name: Living Room
        variables:
          image: livingroom-demo
          preload_rooms: *room_images
          light_entity_1: light.living_room_accent_1
          light_entity_2: light.living_room_shelves
          light_entity_3: light.living_room_2ch_wi_fi_switch_module_switch_2
          light_entity_4: light.living_room_balcony
          light_entity_5: light.zeppelin_light
          media_player_1: media_player.tv_w_salonie
          media_player_2: media_player.zeppelin
          cinema_mode_entity: input_boolean.jellyfin_cinema_mode_enabled
      - !include /config/dashboards/templates/includes/hemma_navbar_tablet.yaml
      - type: custom:hemma-smart-row
        cards:
          - type: custom:button-card
            template: hemma_light
            entity: light.living_room_accent_1
            name: Accent
            variables:
              icon: lightbulb-variant-outline
            tap_action:
              action: call-service
              service: light.toggle
              target:
                entity_id: light.living_room_accent_1
          - type: custom:button-card
            template: hemma_light
            entity: light.living_room_shelves
            name: Shelves
            variables:
              icon: display-shelf-light
              lights:
                - light.living_room_2ch_wi_fi_switch_module_2_switch_1
                - light.living_room_2ch_wi_fi_switch_module_switch_1
          - type: custom:button-card
            template: hemma_light
            entity: light.living_room_2ch_wi_fi_switch_module_switch_2
            name: TV Overlight
            variables:
              icon: track-light
            tap_action:
              action: call-service
              service: light.toggle
              target:
                entity_id: light.living_room_2ch_wi_fi_switch_module_switch_2
          - type: custom:button-card
            template: hemma_light
            entity: light.living_room_balcony
            name: Balcony
            variables:
              icon: square-ceiling-light
            tap_action:
              action: call-service
              service: light.toggle
              target:
                entity_id: light.living_room_balcony
          - type: custom:button-card
            template: hemma_light
            entity: light.zeppelin_light
            name: Zeppelin Light
            variables:
              icon: zeppelin-pendant-v1
          - type: custom:button-card
            template: hemma_media
            entity: media_player.living_room_tv_2
            name: TV
            variables:
              icon: tv
              show_toggle: true
            tap_action:
              haptic: light
              action: fire-dom-event
              hemma_popup:
                title: TV Remote
                eyebrow: Living Room TV
                dismissable: true
                dismiss_on_background: true
                popup_styles:
                  - style: all
                    styles: |
                      --hemma-popup-justify: flex-end;
                      --hemma-popup-align: flex-end;
                      --hemma-popup-top: 18px;
                      --hemma-popup-right: clamp(0px, calc(100vw - 768px), 18px);
                      --hemma-popup-bottom: clamp(0px, calc(100vw - 768px), 18px);
                      --hemma-popup-radius: 28px;
                      --hemma-popup-header-gap: 2px;
                      --hemma-popup-tint: rgba(18,18,22,0.84);
                      --hemma-popup-grain: 0;
                      --hemma-popup-grain-dark: 0;
                      --popup-min-width: 360px;
                      --popup-max-width: 360px;
                content:
                  type: custom:button-card
                  template: hemma_tv_remote_panel
                  variables:
                    remote_entity: remote.living_room_tv
          - type: custom:button-card
            template: hemma_media
            entity: media_player.zeppelin
            name: Zeppelin
            variables:
              icon: zeppelin-speaker-v2

  - type: custom:grid-layout
    title: Kitchen
    path: kitchen
    theme: Hemma
    layout: !include /config/dashboards/templates/includes/hemma_screen_layout.yaml
    cards:
      - type: custom:button-card
        template: hemma_room
        name: Kitchen
        variables:
          image: home-demo
          preload_rooms: *room_images
      - !include /config/dashboards/templates/includes/hemma_navbar_tablet.yaml
      - type: custom:hemma-smart-row
        cards:
          - type: custom:button-card
            template: hemma_entity
            entity: switch.ikea_of_sweden_grillplats_plug_2
            name: Lelit Espresso Machine
            variables:
              icon: coffee-maker-mdi-v1
              show_toggle: true
            tap_action:
              action: call-service
              service: switch.toggle
              target:
                entity_id: switch.ikea_of_sweden_grillplats_plug_2

  - type: custom:grid-layout
    title: Bedroom
    path: bedroom
    theme: Hemma
    layout: !include /config/dashboards/templates/includes/hemma_screen_layout.yaml
    cards:
      - type: custom:button-card
        template: hemma_room
        name: Bedroom
        variables:
          image: bedroom-demo
          preload_rooms: *room_images
          light_entity_1: light.bedroom_accent_bedroom
          light_entity_2: light.3_in_1_controller_wifi_2_4g
          light_entity_3: light.bedroom_ikea_of_sweden_grillplats_plug
          wake_alarm_enabled_entity: input_boolean.wake_up_enabled
          wake_alarm_time_entity: input_datetime.wake_up_time
          wake_alarm_evening_only: false
      - !include /config/dashboards/templates/includes/hemma_navbar_tablet.yaml
      - type: custom:hemma-smart-row
        cards:
          - type: custom:button-card
            template: hemma_light
            entity: light.bedroom_accent_bedroom
            name: Accent
            variables:
              icon: lightbulb-variant-outline
            tap_action:
              action: call-service
              service: light.toggle
              target:
                entity_id: light.bedroom_accent_bedroom
          - type: custom:button-card
            template: hemma_light
            entity: light.bedroom_ikea_of_sweden_grillplats_plug
            name: Bed Lamp
            variables:
              icon: bed-lamp-v1
            tap_action:
              action: call-service
              service: light.toggle
              target:
                entity_id: light.bedroom_ikea_of_sweden_grillplats_plug
          - type: custom:button-card
            template: hemma_light
            entity: light.3_in_1_controller_wifi_2_4g
            name: LED Strip
            variables:
              icon: led-strip-variant
          - type: custom:button-card
            template: hemma_entity
            entity: input_button.stop_wake_up_music
            name: Stop Wake-up Music
            variables:
              icon: alarm-off-v1
            tap_action:
              action: call-service
              service: input_button.press
              target:
                entity_id: input_button.stop_wake_up_music

  - type: custom:grid-layout
    title: Bathroom
    path: bathroom
    theme: Hemma
    layout: !include /config/dashboards/templates/includes/hemma_screen_layout.yaml
    cards:
      - type: custom:button-card
        template: hemma_room
        name: Bathroom
        variables:
          image: home-demo
          preload_rooms: *room_images
          light_entity_1: light.bathroom_led_bathroom
      - !include /config/dashboards/templates/includes/hemma_navbar_tablet.yaml
      - type: custom:hemma-smart-row
        cards:
          - type: custom:button-card
            template: hemma_light
            entity: light.bathroom_led_bathroom
            name: LED Strip
            variables:
              icon: led-strip-variant
            tap_action:
              action: call-service
              service: light.toggle
              target:
                entity_id: light.bathroom_led_bathroom
          - type: custom:button-card
            template: hemma_entity
            entity: switch.bathroom_lamp
            name: Bathroom Lamp
            variables:
              icon: lightbulb-variant-outline
              show_toggle: true
            tap_action:
              action: call-service
              service: switch.toggle
              target:
                entity_id: switch.bathroom_lamp
          - type: custom:button-card
            template: hemma_fan
            entity: fan.bathroom_fan_bathroom
            name: Ventilation
            variables:
              icon: bathroom-extractor-v1
            styles:
              card:
                - --hemma-fan-animation: none

  - type: custom:grid-layout
    title: Corridor
    path: corridor
    theme: Hemma
    layout: !include /config/dashboards/templates/includes/hemma_screen_layout.yaml
    cards:
      - type: custom:button-card
        template: hemma_room
        name: Corridor
        variables:
          image: home-demo
          preload_rooms: *room_images
          light_entity_1: light.living_room_2ch_wi_fi_switch_module_2_switch_2
      - !include /config/dashboards/templates/includes/hemma_navbar_tablet.yaml
      - type: custom:hemma-smart-row
        cards:
          - type: custom:button-card
            template: hemma_light
            entity: light.living_room_2ch_wi_fi_switch_module_2_switch_2
            name: Wardrobe LED
            variables:
              icon: led-strip-variant
            tap_action:
              action: call-service
              service: light.toggle
              target:
                entity_id: light.living_room_2ch_wi_fi_switch_module_2_switch_2
            styles:
              card:
                - --hemma-icon-circle-bg: |
                    [[[
                      return entity?.state === 'on'
                        ? '#42b9ff'
                        : 'rgba(0,0,0,0.20)';
                    ]]]
              img_cell:
                - background: |
                    [[[
                      return entity?.state === 'on'
                        ? '#42b9ff !important'
                        : 'rgba(0,0,0,0.20) !important';
                    ]]]
