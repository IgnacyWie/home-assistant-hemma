          preload_rooms: *room_images
          light_entity_1: light.living_room_accent_1
          light_entity_2: light.living_room_shelves
          light_entity_3: light.living_room_2ch_wi_fi_switch_module_switch_2
          light_entity_4: light.living_room_balcony
          media_player_1: media_player.tv_w_salonie_4
          media_player_2: media_player.zeppelin
      - !include /config/dashboards/templates/includes/hemma_navbar_tablet.yaml
      - type: custom:hemma-smart-row
        cards:
          - type: custom:button-card
            template: hemma_light
            entity: light.living_room_accent_1
            name: Accent
            variables:
              icon: lightbulb-variant-outline
            tap_action:
              action: call-service
              service: light.toggle
              target:
                entity_id: light.living_room_accent_1
          - type: custom:button-card
            template: hemma_light
            entity: light.living_room_shelves
            name: Shelves
            variables:
              icon: display-shelf-light
              lights:
                - light.living_room_2ch_wi_fi_switch_module_2_switch_1
                - light.living_room_2ch_wi_fi_switch_module_switch_1
          - type: custom:button-card
            template: hemma_light
            entity: light.living_room_2ch_wi_fi_switch_module_switch_2
            name: TV Overlight
            variables:
              icon: track-light
            tap_action:
              action: call-service
              service: light.toggle
              target:
                entity_id: light.living_room_2ch_wi_fi_switch_module_switch_2
          - type: custom:button-card
            template: hemma_light
            entity: light.living_room_balcony
            name: Balcony
            variables:
              icon: square-ceiling-light
            tap_action:
              action: call-service
              service: light.toggle
              target:
                entity_id: light.living_room_balcony
          - type: custom:button-card
            template: hemma_media
            entity: media_player.living_room_tv_2
            name: TV
            variables:
              icon: tv
              show_toggle: true
            tap_action:
              haptic: light
              action: fire-dom-event
              hemma_popup:
                title: TV Remote
                eyebrow: Living Room TV
                dismissable: true
                dismiss_on_background: true
                popup_styles:
                  - style: all
                    styles: |
                      --hemma-popup-justify: flex-end;
                      --hemma-popup-align: flex-end;
                      --hemma-popup-top: 18px;
                      --hemma-popup-right: clamp(0px, calc(100vw - 768px), 18px);
                      --hemma-popup-bottom: clamp(0px, calc(100vw - 768px), 18px);
                      --hemma-popup-radius: 28px;
                      --hemma-popup-header-gap: 2px;
                      --hemma-popup-tint: rgba(18,18,22,0.84);
                      --hemma-popup-grain: 0;
                      --hemma-popup-grain-dark: 0;
                      --popup-min-width: 360px;
                      --popup-max-width: 360px;
                content:
                  type: custom:button-card
                  template: hemma_tv_remote_panel
                  variables:
                    remote_entity: remote.living_room_tv
          - type: custom:button-card
            template: hemma_media
            entity: media_player.zeppelin
            name: Zeppelin
            variables:
              icon: zeppelin-speaker-v2

  - type: custom:grid-layout
    title: Kitchen
    path: kitchen
    theme: Hemma
    layout: !include /config/dashboards/templates/includes/hemma_screen_layout.yaml
    cards:
      - type: custom:button-card
        template: hemma_room
        name: Kitchen
        variables:
          image: home-demo
          preload_rooms: *room_images
      - !include /config/dashboards/templates/includes/hemma_navbar_tablet.yaml
      - type: custom:hemma-smart-row
        cards:
          - type: custom:button-card
            template: hemma_entity
            entity: switch.ikea_of_sweden_grillplats_plug_2
            name: Lelit Espresso Machine
            variables:
              icon: coffee-maker-mdi-v1
              show_toggle: true
            tap_action:
              action: call-service
              service: switch.toggle
              target:
                entity_id: switch.ikea_of_sweden_grillplats_plug_2

  - type: custom:grid-layout
    title: Bedroom
    path: bedroom
    theme: Hemma
    layout: !include /config/dashboards/templates/includes/hemma_screen_layout.yaml
    cards:
      - type: custom:button-card
        template: hemma_room
        name: Bedroom
        variables:
          image: bedroom-demo
          preload_rooms: *room_images
          light_entity_1: light.bedroom_accent_bedroom
          light_entity_2: light.3_in_1_controller_wifi_2_4g
      - !include /config/dashboards/templates/includes/hemma_navbar_tablet.yaml
      - type: custom:hemma-smart-row
        cards:
          - type: custom:button-card
            template: hemma_light
            entity: light.bedroom_accent_bedroom
            name: Accent
            variables:
              icon: lightbulb-variant-outline
            tap_action:
              action: call-service
              service: light.toggle
              target:
                entity_id: light.bedroom_accent_bedroom
          - type: custom:button-card
            template: hemma_light
            entity: light.3_in_1_controller_wifi_2_4g
            name: LED Strip
            variables:
              icon: led-strip-variant
            tap_action:
              action: more-info
              entity: light.3_in_1_controller_wifi_2_4g
          - type: custom:button-card
            template: hemma_entity
            entity: input_boolean.wake_up_enabled
            name: Wake-up Alarm
            variables:
              icon: alarm
              show_toggle: true
            state_display: |
              [[[
                const enabled = states['input_boolean.wake_up_enabled']?.state === 'on';
                const raw = states['input_datetime.wake_up_time']?.state || '';
                const time = raw.length >= 5 ? raw.slice(0, 5) : '--:--';
                return `${enabled ? 'On' : 'Off'} · ${time}`;
              ]]]
            hold_action:
              action: more-info
              entity: input_datetime.wake_up_time
          - type: custom:button-card
            template: hemma_entity
            entity: input_button.stop_wake_up_music
            name: Stop Wake-up Music
            variables:
              icon: alarm-off-v1
            tap_action:
              action: call-service
              service: input_button.press
              target:
                entity_id: input_button.stop_wake_up_music

  - type: custom:grid-layout
    title: Bathroom
    path: bathroom
    theme: Hemma
    layout: !include /config/dashboards/templates/includes/hemma_screen_layout.yaml
    cards:
      - type: custom:button-card
        template: hemma_room
        name: Bathroom
        variables:
          image: home-demo
          preload_rooms: *room_images
          light_entity_1: light.sonoff_zbminil2
      - !include /config/dashboards/templates/includes/hemma_navbar_tablet.yaml
      - type: custom:hemma-smart-row
        cards:
          - type: custom:button-card
            template: hemma_light
            entity: light.sonoff_zbminil2
            name: LED Strip
            variables:
              icon: led-strip-variant
            tap_action:
              action: call-service
              service: light.toggle
              target:
                entity_id: light.sonoff_zbminil2
          - type: custom:button-card
            template: hemma_entity
            entity: switch.bathroom_lamp
            name: Bathroom Lamp
            variables:
              icon: lightbulb-variant-outline
              show_toggle: true
            tap_action:
              action: call-service
              service: switch.toggle
              target:
                entity_id: switch.bathroom_lamp
          - type: custom:button-card
            template: hemma_fan
            entity: fan.bathroom_fan_bathroom
            name: Ventilation
            variables:
              icon: bathroom-extractor-v1
            styles:
              card:
                - --hemma-fan-animation: none

  - type: custom:grid-layout
    title: Corridor
    path: corridor
    theme: Hemma
    layout: !include /config/dashboards/templates/includes/hemma_screen_layout.yaml
    cards:
      - type: custom:button-card
        template: hemma_room
        name: Corridor
        variables:
          image: home-demo
          preload_rooms: *room_images
          light_entity_1: light.living_room_2ch_wi_fi_switch_module_2_switch_2
      - !include /config/dashboards/templates/includes/hemma_navbar_tablet.yaml
      - type: custom:hemma-smart-row
        cards:
          - type: custom:button-card
            template: hemma_light
            entity: light.living_room_2ch_wi_fi_switch_module_2_switch_2
            name: Wardrobe LED
            variables:
              icon: led-strip-variant
            tap_action:
              action: call-service
              service: light.toggle
              target:
                entity_id: light.living_room_2ch_wi_fi_switch_module_2_switch_2
            styles:
              card:
                - --hemma-icon-circle-bg: |
                    [[[
                      return entity?.state === 'on'
                        ? '#42b9ff'
                        : 'rgba(0,0,0,0.20)';
                    ]]]
              img_cell:
                - background: |
                    [[[
                      return entity?.state === 'on'
                        ? '#42b9ff !important'
                        : 'rgba(0,0,0,0.20) !important';
                    ]]]
