template:
  - fan:
      - name: "Kitchen Extractor Fan"
        unique_id: kitchen_extractor_fan
        icon: mdi:fan
        state: >-
          {{ is_state('switch.2ch_wi_fi_switch_module_4_switch_1', 'on')
             or is_state('switch.2ch_wi_fi_switch_module_4_switch_2', 'on') }}
        percentage: >-
          {% if is_state('switch.2ch_wi_fi_switch_module_4_switch_2', 'on') %}
            100
          {% elif is_state('switch.2ch_wi_fi_switch_module_4_switch_1', 'on') %}
            50
          {% else %}
            0
          {% endif %}
        speed_count: 2
        turn_on:
          - action: switch.turn_off
            target:
              entity_id:
                - switch.2ch_wi_fi_switch_module_4_switch_1
                - switch.2ch_wi_fi_switch_module_4_switch_2
          - delay:
              milliseconds: 500
          - action: switch.turn_on
            target:
              entity_id: switch.2ch_wi_fi_switch_module_4_switch_1
        turn_off:
          - action: switch.turn_off
            target:
              entity_id:
                - switch.2ch_wi_fi_switch_module_4_switch_1
                - switch.2ch_wi_fi_switch_module_4_switch_2
        set_percentage:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ percentage == 0 }}"
                sequence:
                  - action: switch.turn_off
                    target:
                      entity_id:
                        - switch.2ch_wi_fi_switch_module_4_switch_1
                        - switch.2ch_wi_fi_switch_module_4_switch_2
              - conditions:
                  - condition: template
                    value_template: "{{ percentage > 0 and percentage <= 50 }}"
                sequence:
                  - action: switch.turn_off
                    target:
                      entity_id:
                        - switch.2ch_wi_fi_switch_module_4_switch_1
                        - switch.2ch_wi_fi_switch_module_4_switch_2
                  - delay:
                      milliseconds: 500
                  - action: switch.turn_on
                    target:
                      entity_id: switch.2ch_wi_fi_switch_module_4_switch_1
            default:
              - action: switch.turn_off
                target:
                  entity_id:
                    - switch.2ch_wi_fi_switch_module_4_switch_1
                    - switch.2ch_wi_fi_switch_module_4_switch_2
              - delay:
                  milliseconds: 500
              - action: switch.turn_on
                target:
                  entity_id: switch.2ch_wi_fi_switch_module_4_switch_2

automation:
  - id: kitchen_extractor_fan_speed_interlock
    alias: "Kitchen Extractor Fan - Relay interlock"
    description: "Keeps the two Tuya fan-speed relays mutually exclusive."
    mode: restart
    triggers:
      - trigger: state
        entity_id: switch.2ch_wi_fi_switch_module_4_switch_1
        to: "on"
        id: speed_1_on
      - trigger: state
        entity_id: switch.2ch_wi_fi_switch_module_4_switch_2
        to: "on"
        id: speed_2_on
    actions:
      - choose:
          - conditions:
              - condition: trigger
                id: speed_1_on
            sequence:
              - action: switch.turn_off
                target:
                  entity_id: switch.2ch_wi_fi_switch_module_4_switch_2
          - conditions:
              - condition: trigger
                id: speed_2_on
            sequence:
              - action: switch.turn_off
                target:
                  entity_id: switch.2ch_wi_fi_switch_module_4_switch_1
