# Outdoor air-quality estimates from Open-Meteo's CAMS-backed API.
# The home zone coordinates keep the configuration portable and avoid storing
# a private location or API credential in source control.
rest:
  - resource_template: >-
      https://air-quality-api.open-meteo.com/v1/air-quality?latitude={{ state_attr('zone.home', 'latitude') }}&longitude={{ state_attr('zone.home', 'longitude') }}&current=european_aqi,pm2_5,pm10&timezone=auto
    scan_interval: 1800
    timeout: 15
    headers:
      User-Agent: Home Assistant Hemma dashboard
    sensor:
      - name: Open Meteo European AQI
        unique_id: open_meteo_european_aqi
        value_template: "{{ value_json.current.european_aqi }}"
        unit_of_measurement: EAQI
        state_class: measurement
        icon: mdi:air-filter

      - name: Open Meteo PM2 5
        unique_id: open_meteo_pm2_5
        value_template: "{{ value_json.current.pm2_5 }}"
        unit_of_measurement: "µg/m³"
        device_class: pm25
        state_class: measurement
        icon: mdi:molecule

      - name: Open Meteo PM10
        unique_id: open_meteo_pm10
        value_template: "{{ value_json.current.pm10 }}"
        unit_of_measurement: "µg/m³"
        device_class: pm10
        state_class: measurement
        icon: mdi:molecule

template:
  - sensor:
      - name: Outdoor Air Quality
        unique_id: outdoor_air_quality
        icon: mdi:air-filter
        availability: "{{ is_number(states('sensor.open_meteo_european_aqi')) }}"
        state: >-
          {% set aqi = states('sensor.open_meteo_european_aqi') | float %}
          {% if aqi <= 20 %}
            good
          {% elif aqi <= 40 %}
            fair
          {% elif aqi <= 60 %}
            moderate
          {% elif aqi <= 80 %}
            poor
          {% elif aqi <= 100 %}
            very poor
          {% else %}
            bad
          {% endif %}
        attributes:
          source: Open-Meteo
          attribution: Weather data by Open-Meteo.com
          european_aqi: "{{ states('sensor.open_meteo_european_aqi') }}"
          pm2_5: "{{ states('sensor.open_meteo_pm2_5') }}"
          pm10: "{{ states('sensor.open_meteo_pm10') }}"
          location_type: outdoor modeled estimate
