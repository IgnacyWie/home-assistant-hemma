- id: 'kitchen_extractor_fan_timeout'
  alias: Kitchen Extractor Fan - 60-minute timeout
  description: Turns off the kitchen extractor after 60 minutes at either speed.
  triggers:
  - trigger: state
    entity_id: fan.kitchen_extractor_fan
    to: 'on'
  conditions: []
  actions:
  - delay:
      hours: 0
      minutes: 60
      seconds: 0
      milliseconds: 0
  - action: fan.turn_off
    target:
      entity_id: fan.kitchen_extractor_fan
  mode: restart

- id: 'kitchen_motion_after_sunset_light'
  alias: Kitchen - Motion light after sunset
  description: Turns on the Kitchen LED for motion after sunset only while the physical kitchen and living-room lights are all off, then turns it off when motion clears.
  triggers:
  - trigger: state
    entity_id: binary_sensor.kitchen_kitchen_motion_sensor_occupancy
    to: 'on'
    id: motion_detected
  - trigger: state
    entity_id: binary_sensor.kitchen_kitchen_motion_sensor_occupancy
    to: 'off'
    id: motion_cleared
  - trigger: sun
    event: sunset
    id: sunset
  conditions: []
  actions:
  - choose:
    - conditions: >-
        {{ trigger.id in ['motion_detected', 'sunset'] and
           is_state('binary_sensor.kitchen_kitchen_motion_sensor_occupancy', 'on') and
           is_state('sun.sun', 'below_horizon') and
           expand([
             'light.kitchen_1',
             'light.kitchen_shelly2pmg4_d885ace4f060_output_1',
             'light.2ch_wi_fi_switch_module_3_switch_1',
             'light.2ch_wi_fi_switch_module_3_switch_2',
             'light.living_room_accent_1',
             'light.living_room_2ch_wi_fi_switch_module_switch_2',
             'light.living_room_2ch_wi_fi_switch_module_2_switch_1',
             'light.living_room_2ch_wi_fi_switch_module_switch_1',
             'light.living_room_balcony'
           ]) | selectattr('state', 'ne', 'off') | list | count == 0 }}
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.kitchen_shelly2pmg4_d885ace4f060_output_1
    - conditions: "{{ trigger.id == 'motion_cleared' }}"
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.kitchen_shelly2pmg4_d885ace4f060_output_1
  mode: restart

- id: 'wake_up_music_zeppelin'
  alias: Wake up with music - Zeppelin
  description: Plays a shuffled Happy Jazz and Bossa Nova morning playlist at the configured wake-up time.
  triggers:
  - trigger: time
    at: input_datetime.wake_up_time
  conditions:
  - condition: state
    entity_id: input_boolean.wake_up_enabled
    state: 'on'
  actions:
  - action: switch.turn_on
    target:
      entity_id: switch.ikea_of_sweden_grillplats_plug_2
  - action: media_player.volume_set
    target:
      entity_id: media_player.zeppelin
    data:
      volume_level: 0.55
  - action: music_assistant.play_media
    target:
      entity_id: media_player.zeppelin
    data:
      media_id: spotify://playlist/6j2DUZglv11u2UgCdozFXM
      media_type: playlist
      enqueue: replace
  - delay: "00:00:03"
  - action: media_player.shuffle_set
    target:
      entity_id: media_player.zeppelin
    data:
      shuffle: true
  - action: media_player.volume_set
    target:
      entity_id: media_player.zeppelin
    data:
      volume_level: 0.55
  mode: single

- id: 'stop_wake_up_music'
  alias: Stop wake-up music
  description: Stops wake-up music on the Zeppelin when the dashboard button is pressed.
  triggers:
  - trigger: state
    entity_id: input_button.stop_wake_up_music
  conditions: []
  actions:
  - action: media_player.media_stop
    target:
      entity_id: media_player.zeppelin
  mode: restart

- id: 'bedroom_bilresa_remote'
  alias: Bedroom - BILRESA bedside remote
  description: Controls bedroom lights, handles bedtime shutdown, and dismisses the Zeppelin wake-up alarm.
  triggers:
  - trigger: device
    domain: zha
    device_id: 7aa051c279e9bda89786b0804d705c64
    type: remote_button_short_press
    subtype: turn_on
    id: turn_on
  - trigger: device
    domain: zha
    device_id: 7aa051c279e9bda89786b0804d705c64
    type: remote_button_short_press
    subtype: turn_off
    id: turn_off
  - trigger: device
    domain: zha
    device_id: 7aa051c279e9bda89786b0804d705c64
    type: remote_button_double_press
    subtype: dim_up
    id: turn_on_double
  - trigger: device
    domain: zha
    device_id: 7aa051c279e9bda89786b0804d705c64
    type: remote_button_double_press
    subtype: dim_down
    id: turn_off_double
  conditions: []
  actions:
  - variables:
      alarm_playing: >-
        {% set title = state_attr('media_player.zeppelin', 'media_title') | default('', true) | string | lower %}
        {% set artist = state_attr('media_player.zeppelin', 'media_artist') | default('', true) | string | lower %}
        {% set last_alarm = state_attr('automation.wake_up_with_music_zeppelin', 'last_triggered') %}
        {{ is_state('media_player.zeppelin', 'playing') and
           ('guten morgen sonnenschein' in title or
            'nana mouskouri' in artist or
            (last_alarm is not none and
             (as_timestamp(now()) - as_timestamp(last_alarm)) < 1800)) }}
      nighttime: "{{ now().hour >= 23 or now().hour < 6 }}"
  - choose:
    - conditions: "{{ alarm_playing }}"
      sequence:
      - action: media_player.media_stop
        target:
          entity_id: media_player.zeppelin
    - conditions: "{{ trigger.id == 'turn_on_double' }}"
      sequence:
      - action: light.turn_on
        target:
          entity_id:
          - light.3_in_1_controller_wifi_2_4g
          - light.bedroom_ikea_of_sweden_grillplats_plug
          - light.bedroom_accent_bedroom
    - conditions: "{{ trigger.id == 'turn_off_double' }}"
      sequence:
      - action: script.turn_on
        continue_on_error: true
        target:
          entity_id: script.leave_home
    - conditions: "{{ trigger.id == 'turn_on' and nighttime }}"
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.bathroom_led_bathroom
      - choose:
        - conditions: "{{ not is_state('light.3_in_1_controller_wifi_2_4g', 'on') }}"
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.3_in_1_controller_wifi_2_4g
        - conditions: "{{ not is_state('light.bedroom_ikea_of_sweden_grillplats_plug', 'on') }}"
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.bedroom_ikea_of_sweden_grillplats_plug
        - conditions: "{{ not is_state('light.bedroom_accent_bedroom', 'on') }}"
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.bedroom_accent_bedroom
    - conditions: "{{ trigger.id == 'turn_on' }}"
      sequence:
      - choose:
        - conditions: >-
            {{ is_state('light.bedroom_ikea_of_sweden_grillplats_plug', 'on') and
               is_state('light.3_in_1_controller_wifi_2_4g', 'on') }}
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.bedroom_accent_bedroom
        default:
        - action: light.turn_on
          target:
            entity_id:
            - light.bedroom_ikea_of_sweden_grillplats_plug
            - light.3_in_1_controller_wifi_2_4g
    - conditions: "{{ trigger.id == 'turn_off' }}"
      sequence:
      - action: light.turn_off
        target:
          entity_id:
          - light.bedroom_ikea_of_sweden_grillplats_plug
          - light.3_in_1_controller_wifi_2_4g
          - light.bedroom_accent_bedroom
      - action: light.turn_off
        target:
          entity_id: light.bathroom_led_bathroom
  mode: restart

- id: 'bedroom_closet_door_light'
  alias: Bedroom Closet - Door light
  description: Turns the bedroom closet light on when the MYGGBETT door opens and off when it closes; resynchronizes after Home Assistant or the light reconnects.
  triggers:
  - trigger: state
    entity_id: binary_sensor.myggbett_door_window_sensor_door
    to: 'on'
  - trigger: state
    entity_id: binary_sensor.myggbett_door_window_sensor_door
    to: 'off'
  - trigger: homeassistant
    event: start
  - trigger: state
    entity_id: light.bedroom_closet
    from: 'unavailable'
  conditions: []
  actions:
  - choose:
    - conditions: "{{ is_state('binary_sensor.myggbett_door_window_sensor_door', 'on') }}"
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.bedroom_closet
    - conditions: "{{ is_state('binary_sensor.myggbett_door_window_sensor_door', 'off') }}"
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.bedroom_closet
  mode: restart

- id: 'lelit_espresso_machine_safety'
  alias: Lelit Espresso Machine - Two-hour safety shutoff
  description: Keeps a restorable two-hour safety timer while the espresso machine is on.
  triggers:
  - trigger: state
    entity_id: switch.ikea_of_sweden_grillplats_plug_2
    to: 'on'
    id: machine_on
  - trigger: state
    entity_id: switch.ikea_of_sweden_grillplats_plug_2
    to: 'off'
    id: machine_off
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.lelit_espresso_safety
    id: timer_finished
  - trigger: homeassistant
    event: start
    id: home_assistant_start
  conditions: []
  actions:
  - choose:
    - conditions: "{{ trigger.id == 'machine_on' }}"
      sequence:
      - action: timer.start
        target:
          entity_id: timer.lelit_espresso_safety
        data:
          duration: "02:00:00"
    - conditions: "{{ trigger.id == 'machine_off' }}"
      sequence:
      - action: timer.cancel
        target:
          entity_id: timer.lelit_espresso_safety
    - conditions: "{{ trigger.id == 'timer_finished' }}"
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.ikea_of_sweden_grillplats_plug_2
    - conditions: >-
        {{ trigger.id == 'home_assistant_start' and
           is_state('switch.ikea_of_sweden_grillplats_plug_2', 'on') and
           not is_state('timer.lelit_espresso_safety', 'active') }}
      sequence:
      - action: timer.start
        target:
          entity_id: timer.lelit_espresso_safety
        data:
          duration: "02:00:00"
  mode: restart

- id: 'jellyfin_cinema_mode'
  alias: Living Room - Jellyfin cinema mode
  description: >-
    Turns off all physical living-room lights during Jellyfin playback while
    Cinema Mode is enabled. The first play in each session snapshots their
    states; pausing, stopping, or disabling Cinema Mode restores that snapshot.
    Resuming after a pause takes a fresh snapshot of the restored state, so
    repeated pause/resume cycles do not overwrite it with the cinema-mode off
    state.
  triggers:
  - trigger: state
    entity_id: media_player.tv_w_salonie
    to: playing
    id: cinema_start
  - trigger: state
    entity_id: media_player.tv_w_salonie
    from: playing
    to: paused
    id: cinema_restore
  - trigger: state
    entity_id: media_player.tv_w_salonie
    from: playing
    to: idle
    id: cinema_restore
  - trigger: state
    entity_id: media_player.tv_w_salonie
    from: playing
    to: 'off'
    id: cinema_restore
  - trigger: state
    entity_id: media_player.tv_w_salonie
    from: playing
    to: unavailable
    id: cinema_restore
  - trigger: state
    entity_id: input_boolean.jellyfin_cinema_mode_enabled
    to: 'off'
    id: cinema_disabled
  conditions: []
  actions:
  - choose:
    - conditions: >-
        {{ trigger.id == 'cinema_start' and
           is_state('input_boolean.jellyfin_cinema_mode_enabled', 'on') and
           is_state('input_boolean.jellyfin_cinema_active', 'off') }}
      sequence:
      - action: scene.create
        data:
          scene_id: living_room_before_cinema
          snapshot_entities:
          - light.living_room_accent_1
          - light.living_room_2ch_wi_fi_switch_module_switch_2
          - light.living_room_2ch_wi_fi_switch_module_2_switch_1
          - light.living_room_2ch_wi_fi_switch_module_switch_1
          - light.living_room_balcony
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.jellyfin_cinema_active
  - choose:
    - conditions: >-
        {{ trigger.id == 'cinema_start' and
           is_state('input_boolean.jellyfin_cinema_mode_enabled', 'on') }}
      sequence:
      - action: light.turn_off
        target:
          entity_id:
          - light.living_room_accent_1
          - light.living_room_2ch_wi_fi_switch_module_switch_2
          - light.living_room_2ch_wi_fi_switch_module_2_switch_1
          - light.living_room_2ch_wi_fi_switch_module_switch_1
          - light.living_room_balcony
    - conditions: >-
        {{ trigger.id in ['cinema_restore', 'cinema_disabled'] and
           is_state('input_boolean.jellyfin_cinema_active', 'on') }}
      sequence:
      # Dynamic scenes intentionally report state "unknown"; the helper is the
      # snapshot-validity flag, so do not gate scene.turn_on on scene state.
      - action: scene.turn_on
        target:
          entity_id: scene.living_room_before_cinema
        continue_on_error: true
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.jellyfin_cinema_active
  mode: restart

- id: 'bathroom_lights_forgotten_on'
  alias: Bathroom - Forgotten lights protection
  description: Turns off each bathroom light after it has remained on for 45 minutes.
  triggers:
  - trigger: state
    entity_id:
    - light.bathroom_led_bathroom
    - switch.bathroom_lamp
    to: 'on'
    for: "00:45:00"
  conditions: []
  actions:
  - action: homeassistant.turn_off
    target:
      entity_id: "{{ trigger.entity_id }}"
  mode: parallel
  max: 2

- id: 'corridor_bilresa_home_modes'
  alias: Corridor - Welcome Home / Leave Home
  description: Maps the corridor BILRESA buttons to home scenes and French jazz lounge music.
  triggers:
  - trigger: state
    entity_id: event.bilresa_dual_button_button_1
    id: welcome_home
  - trigger: state
    entity_id: event.bilresa_dual_button_button_2
    id: leave_home
  conditions: []
  actions:
  - choose:
    - conditions: "{{ trigger.id == 'welcome_home' and trigger.to_state.attributes.event_type == 'multi_press_1' }}"
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.welcome_home
    - conditions: "{{ trigger.id == 'welcome_home' and trigger.to_state.attributes.event_type == 'multi_press_2' }}"
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.french_jazz_lounge
    - conditions: "{{ trigger.id == 'leave_home' and trigger.to_state.attributes.event_type == 'multi_press_1' }}"
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.leave_home
  mode: restart

- id: 'living_room_tradfri_media_remote'
  alias: Living Room - TRADFRI media remote
  description: >-
    Uses the five-button TRADFRI remote only for Zeppelin volume and track skips.
  triggers:
  - trigger: device
    domain: zha
    device_id: a8940bb7824bdae5bfe525f2e61e95f3
    type: remote_button_short_press
    subtype: dim_up
    id: volume_up
  - trigger: device
    domain: zha
    device_id: a8940bb7824bdae5bfe525f2e61e95f3
    type: remote_button_long_press
    subtype: dim_up
    id: volume_up
  - trigger: device
    domain: zha
    device_id: a8940bb7824bdae5bfe525f2e61e95f3
    type: remote_button_short_press
    subtype: dim_down
    id: volume_down
  - trigger: device
    domain: zha
    device_id: a8940bb7824bdae5bfe525f2e61e95f3
    type: remote_button_long_press
    subtype: dim_down
    id: volume_down
  - trigger: device
    domain: zha
    device_id: a8940bb7824bdae5bfe525f2e61e95f3
    type: remote_button_short_press
    subtype: left
    id: previous_or_left
  - trigger: device
    domain: zha
    device_id: a8940bb7824bdae5bfe525f2e61e95f3
    type: remote_button_short_press
    subtype: right
    id: next_or_right
  conditions: []
  actions:
  - choose:
    - conditions: "{{ trigger.id == 'volume_up' }}"
      sequence:
      - action: media_player.volume_up
        target:
          entity_id: media_player.zeppelin
    - conditions: "{{ trigger.id == 'volume_down' }}"
      sequence:
      - action: media_player.volume_down
        target:
          entity_id: media_player.zeppelin
    - conditions: "{{ trigger.id == 'previous_or_left' }}"
      sequence:
      - action: media_player.media_previous_track
        target:
          entity_id: media_player.zeppelin
    - conditions: "{{ trigger.id == 'next_or_right' }}"
      sequence:
      - action: media_player.media_next_track
        target:
          entity_id: media_player.zeppelin
  mode: queued
  max: 10

- id: 'living_room_tradfri_center_button'
  alias: Living Room - TRADFRI center button
  description: Instantly pauses or resumes the Zeppelin.
  triggers:
  - trigger: device
    domain: zha
    device_id: a8940bb7824bdae5bfe525f2e61e95f3
    type: remote_button_short_press
    subtype: turn_on
  conditions: []
  actions:
  - variables:
      active_transport_player: media_player.zeppelin
  - choose:
    - conditions: >-
        {{ active_transport_player | length > 0 and
           states(active_transport_player) == 'paused' }}
      sequence:
      - action: media_player.media_play
        target:
          entity_id: media_player.zeppelin
    - conditions: >-
        {{ active_transport_player | length > 0 and
           states(active_transport_player) == 'playing' }}
      sequence:
      - action: media_player.media_pause
        target:
          entity_id: media_player.zeppelin
    - conditions: >-
        {{ states(active_transport_player) not in ['playing', 'paused'] }}
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.french_jazz_lounge
  mode: restart

