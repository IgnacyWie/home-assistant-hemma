- id: 'wake_up_music_zeppelin'
  alias: Wake up with music - Zeppelin
  description: Plays Guten Morgen Sonnenschein by Nana Mouskouri at the configured wake-up time.
  triggers:
  - trigger: time
    at: input_datetime.wake_up_time
  conditions:
  - condition: state
    entity_id: input_boolean.wake_up_enabled
    state: 'on'
  actions:
  - action: switch.turn_on
    target:
      entity_id: switch.ikea_of_sweden_grillplats_plug_2
  - action: media_player.volume_set
    target:
      entity_id: media_player.zeppelin
    data:
      volume_level: 0.55
  - action: music_assistant.play_media
    target:
      entity_id: media_player.zeppelin
    data:
      media_id: Guten Morgen Sonnenschein
      media_type: track
      artist: Nana Mouskouri
      enqueue: replace
  - delay: "00:00:03"
  - action: media_player.volume_set
    target:
      entity_id: media_player.zeppelin
    data:
      volume_level: 0.55
  mode: single

- id: 'stop_wake_up_music'
  alias: Stop wake-up music
  description: Stops wake-up music on the Zeppelin when the dashboard button is pressed.
  triggers:
  - trigger: state
    entity_id: input_button.stop_wake_up_music
  conditions: []
  actions:
  - action: media_player.media_stop
    target:
      entity_id: media_player.zeppelin
  mode: restart

- id: 'bedroom_bilresa_remote'
  alias: Bedroom - BILRESA bedside remote
  description: Controls bedroom lights, handles bedtime shutdown, and dismisses the Zeppelin wake-up alarm.
  triggers:
  - trigger: device
    domain: zha
    device_id: 7aa051c279e9bda89786b0804d705c64
    type: remote_button_short_press
    subtype: turn_on
    id: turn_on
  - trigger: device
    domain: zha
    device_id: 7aa051c279e9bda89786b0804d705c64
    type: remote_button_short_press
    subtype: turn_off
    id: turn_off
  - trigger: device
    domain: zha
    device_id: 7aa051c279e9bda89786b0804d705c64
    type: remote_button_double_press
    subtype: dim_up
    id: turn_on_double
  - trigger: device
    domain: zha
    device_id: 7aa051c279e9bda89786b0804d705c64
    type: remote_button_double_press
    subtype: dim_down
    id: turn_off_double
  conditions: []
  actions:
  - variables:
      alarm_playing: >-
        {% set title = state_attr('media_player.zeppelin', 'media_title') | default('', true) | string | lower %}
        {% set artist = state_attr('media_player.zeppelin', 'media_artist') | default('', true) | string | lower %}
        {% set last_alarm = state_attr('automation.wake_up_with_music_zeppelin', 'last_triggered') %}
        {{ is_state('media_player.zeppelin', 'playing') and
           ('guten morgen sonnenschein' in title or
            'nana mouskouri' in artist or
            (last_alarm is not none and
             (as_timestamp(now()) - as_timestamp(last_alarm)) < 1800)) }}
      nighttime: "{{ now().hour >= 23 or now().hour < 6 }}"
  - choose:
    - conditions: "{{ alarm_playing }}"
      sequence:
      - action: media_player.media_stop
        target:
          entity_id: media_player.zeppelin
    - conditions: "{{ trigger.id == 'turn_on_double' }}"
      sequence:
      - action: light.turn_on
        target:
          entity_id:
          - light.3_in_1_controller_wifi_2_4g
          - light.bedroom_ikea_of_sweden_grillplats_plug
          - light.bedroom_accent_bedroom
    - conditions: "{{ trigger.id == 'turn_off_double' }}"
      sequence:
      - action: script.turn_on
        continue_on_error: true
        target:
          entity_id: script.leave_home
    - conditions: "{{ trigger.id == 'turn_on' and nighttime }}"
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.bathroom_lamp
      - choose:
        - conditions: "{{ not is_state('light.3_in_1_controller_wifi_2_4g', 'on') }}"
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.3_in_1_controller_wifi_2_4g
        - conditions: "{{ not is_state('light.bedroom_ikea_of_sweden_grillplats_plug', 'on') }}"
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.bedroom_ikea_of_sweden_grillplats_plug
        - conditions: "{{ not is_state('light.bedroom_accent_bedroom', 'on') }}"
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.bedroom_accent_bedroom
    - conditions: "{{ trigger.id == 'turn_on' }}"
      sequence:
      - choose:
        - conditions: >-
            {{ is_state('light.bedroom_ikea_of_sweden_grillplats_plug', 'on') and
               is_state('light.3_in_1_controller_wifi_2_4g', 'on') }}
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.bedroom_accent_bedroom
        default:
        - action: light.turn_on
          target:
            entity_id:
            - light.bedroom_ikea_of_sweden_grillplats_plug
            - light.3_in_1_controller_wifi_2_4g
    - conditions: "{{ trigger.id == 'turn_off' }}"
      sequence:
      - action: light.turn_off
        target:
          entity_id:
          - light.bedroom_ikea_of_sweden_grillplats_plug
          - light.3_in_1_controller_wifi_2_4g
          - light.bedroom_accent_bedroom
      - action: switch.turn_off
        target:
          entity_id: switch.bathroom_lamp
  mode: restart

- id: 'lelit_espresso_machine_safety'
  alias: Lelit Espresso Machine - Two-hour safety shutoff
  description: Keeps a restorable two-hour safety timer while the espresso machine is on.
  triggers:
  - trigger: state
    entity_id: switch.ikea_of_sweden_grillplats_plug_2
    to: 'on'
    id: machine_on
  - trigger: state
    entity_id: switch.ikea_of_sweden_grillplats_plug_2
    to: 'off'
    id: machine_off
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.lelit_espresso_safety
    id: timer_finished
  - trigger: homeassistant
    event: start
    id: home_assistant_start
  conditions: []
  actions:
  - choose:
    - conditions: "{{ trigger.id == 'machine_on' }}"
      sequence:
      - action: timer.start
        target:
          entity_id: timer.lelit_espresso_safety
        data:
          duration: "02:00:00"
    - conditions: "{{ trigger.id == 'machine_off' }}"
      sequence:
      - action: timer.cancel
        target:
          entity_id: timer.lelit_espresso_safety
    - conditions: "{{ trigger.id == 'timer_finished' }}"
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.ikea_of_sweden_grillplats_plug_2
    - conditions: >-
        {{ trigger.id == 'home_assistant_start' and
           is_state('switch.ikea_of_sweden_grillplats_plug_2', 'on') and
           not is_state('timer.lelit_espresso_safety', 'active') }}
      sequence:
      - action: timer.start
        target:
          entity_id: timer.lelit_espresso_safety
        data:
          duration: "02:00:00"
  mode: restart

- id: 'jellyfin_cinema_mode'
  alias: Living Room - Jellyfin cinema mode
  description: >-
    Turns off all physical living-room lights during Jellyfin playback while
    Cinema Mode is enabled. The first play in each session snapshots their
    states; pausing, stopping, or disabling Cinema Mode restores that snapshot.
    Resuming after a pause takes a fresh snapshot of the restored state, so
    repeated pause/resume cycles do not overwrite it with the cinema-mode off
    state.
  triggers:
  - trigger: state
    entity_id: media_player.tv_w_salonie_4
    to: playing
    id: cinema_start
  - trigger: state
    entity_id: media_player.tv_w_salonie_4
    from: playing
    to: paused
    id: cinema_restore
  - trigger: state
    entity_id: media_player.tv_w_salonie_4
    from: playing
    to: idle
    id: cinema_restore
  - trigger: state
    entity_id: media_player.tv_w_salonie_4
    from: playing
    to: 'off'
    id: cinema_restore
  - trigger: state
    entity_id: media_player.tv_w_salonie_4
    from: playing
    to: unavailable
    id: cinema_restore
  - trigger: state
    entity_id: input_boolean.jellyfin_cinema_mode_enabled
    to: 'off'
    id: cinema_disabled
  conditions: []
  actions:
  - choose:
    - conditions: >-
        {{ trigger.id == 'cinema_start' and
           is_state('input_boolean.jellyfin_cinema_mode_enabled', 'on') and
           is_state('input_boolean.jellyfin_cinema_active', 'off') }}
      sequence:
      - action: scene.create
        data:
          scene_id: living_room_before_cinema
          snapshot_entities:
          - light.living_room_accent_1
          - light.living_room_2ch_wi_fi_switch_module_switch_2
          - light.living_room_2ch_wi_fi_switch_module_2_switch_1
          - light.living_room_2ch_wi_fi_switch_module_switch_1
          - light.living_room_balcony
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.jellyfin_cinema_active
  - choose:
    - conditions: >-
        {{ trigger.id == 'cinema_start' and
           is_state('input_boolean.jellyfin_cinema_mode_enabled', 'on') }}
      sequence:
      - action: light.turn_off
        target:
          entity_id:
          - light.living_room_accent_1
          - light.living_room_2ch_wi_fi_switch_module_switch_2
          - light.living_room_2ch_wi_fi_switch_module_2_switch_1
          - light.living_room_2ch_wi_fi_switch_module_switch_1
          - light.living_room_balcony
    - conditions: >-
        {{ trigger.id in ['cinema_restore', 'cinema_disabled'] and
           is_state('input_boolean.jellyfin_cinema_active', 'on') }}
      sequence:
      # Dynamic scenes intentionally report state "unknown"; the helper is the
      # snapshot-validity flag, so do not gate scene.turn_on on scene state.
      - action: scene.turn_on
        target:
          entity_id: scene.living_room_before_cinema
        continue_on_error: true
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.jellyfin_cinema_active
  mode: restart

- id: 'bathroom_lights_forgotten_on'
  alias: Bathroom - Forgotten lights protection
  description: Turns off each bathroom light after it has remained on for 45 minutes.
  triggers:
  - trigger: state
    entity_id:
    - light.sonoff_zbminil2
    - switch.bathroom_lamp
    to: 'on'
    for: "00:45:00"
  conditions: []
  actions:
  - action: homeassistant.turn_off
    target:
      entity_id: "{{ trigger.entity_id }}"
  mode: parallel
  max: 2

