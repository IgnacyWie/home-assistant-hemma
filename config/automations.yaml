- id: 'kitchen_extractor_fan_timeout'
  alias: Kitchen Extractor Fan - 60-minute timeout
  description: Turns off the kitchen extractor after 60 minutes at either speed.
  triggers:
  - trigger: state
    entity_id: fan.kitchen_extractor_fan
    to: 'on'
  conditions: []
  actions:
  - delay:
      hours: 0
      minutes: 60
      seconds: 0
      milliseconds: 0
  - action: fan.turn_off
    target:
      entity_id: fan.kitchen_extractor_fan
  mode: restart

- id: 'wake_up_music_zeppelin'
  alias: Wake up with music - Zeppelin
  description: Plays a shuffled Happy Jazz and Bossa Nova morning playlist at the configured wake-up time.
  triggers:
  - trigger: time
    at: input_datetime.wake_up_time
  conditions:
  - condition: state
    entity_id: input_boolean.wake_up_enabled
    state: 'on'
  actions:
  - action: switch.turn_on
    target:
      entity_id: switch.ikea_of_sweden_grillplats_plug_2
  - action: media_player.volume_set
    target:
      entity_id: media_player.zeppelin
    data:
      volume_level: 0.55
  - action: music_assistant.play_media
    target:
      entity_id: media_player.zeppelin
    data:
      media_id: spotify://playlist/6j2DUZglv11u2UgCdozFXM
      media_type: playlist
      enqueue: replace
  - delay: "00:00:03"
  - action: media_player.shuffle_set
    target:
      entity_id: media_player.zeppelin
    data:
      shuffle: true
  - action: media_player.volume_set
    target:
      entity_id: media_player.zeppelin
    data:
      volume_level: 0.55
  mode: single

- id: 'stop_wake_up_music'
  alias: Stop wake-up music
  description: Stops wake-up music on the Zeppelin when the dashboard button is pressed.
  triggers:
  - trigger: state
    entity_id: input_button.stop_wake_up_music
  conditions: []
  actions:
  - action: media_player.media_stop
    target:
      entity_id: media_player.zeppelin
  mode: restart

- id: 'bedroom_bilresa_remote'
  alias: Bedroom - BILRESA bedside remote
  description: Controls bedroom lights, handles bedtime shutdown, and dismisses the Zeppelin wake-up alarm.
  triggers:
  - trigger: device
    domain: zha
    device_id: 7aa051c279e9bda89786b0804d705c64
    type: remote_button_short_press
    subtype: turn_on
    id: turn_on
  - trigger: device
    domain: zha
    device_id: 7aa051c279e9bda89786b0804d705c64
    type: remote_button_short_press
    subtype: turn_off
    id: turn_off
  - trigger: device
    domain: zha
    device_id: 7aa051c279e9bda89786b0804d705c64
    type: remote_button_double_press
    subtype: dim_up
    id: turn_on_double
  - trigger: device
    domain: zha
    device_id: 7aa051c279e9bda89786b0804d705c64
    type: remote_button_double_press
    subtype: dim_down
    id: turn_off_double
  conditions: []
  actions:
  - variables:
      alarm_playing: >-
        {% set title = state_attr('media_player.zeppelin', 'media_title') | default('', true) | string | lower %}
        {% set artist = state_attr('media_player.zeppelin', 'media_artist') | default('', true) | string | lower %}
        {% set last_alarm = state_attr('automation.wake_up_with_music_zeppelin', 'last_triggered') %}
        {{ is_state('media_player.zeppelin', 'playing') and
           ('guten morgen sonnenschein' in title or
            'nana mouskouri' in artist or
            (last_alarm is not none and
             (as_timestamp(now()) - as_timestamp(last_alarm)) < 1800)) }}
      nighttime: "{{ now().hour >= 23 or now().hour < 6 }}"
  - choose:
    - conditions: "{{ alarm_playing }}"
      sequence:
      - action: media_player.media_stop
        target:
          entity_id: media_player.zeppelin
    - conditions: "{{ trigger.id == 'turn_on_double' }}"
      sequence:
      - action: light.turn_on
        target:
          entity_id:
          - light.3_in_1_controller_wifi_2_4g
          - light.bedroom_ikea_of_sweden_grillplats_plug
          - light.bedroom_accent_bedroom
    - conditions: "{{ trigger.id == 'turn_off_double' }}"
      sequence:
      - action: script.turn_on
        continue_on_error: true
        target:
          entity_id: script.leave_home
    - conditions: "{{ trigger.id == 'turn_on' and nighttime }}"
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.bathroom_led_bathroom
      - choose:
        - conditions: "{{ not is_state('light.3_in_1_controller_wifi_2_4g', 'on') }}"
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.3_in_1_controller_wifi_2_4g
        - conditions: "{{ not is_state('light.bedroom_ikea_of_sweden_grillplats_plug', 'on') }}"
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.bedroom_ikea_of_sweden_grillplats_plug
        - conditions: "{{ not is_state('light.bedroom_accent_bedroom', 'on') }}"
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.bedroom_accent_bedroom
    - conditions: "{{ trigger.id == 'turn_on' }}"
      sequence:
      - choose:
        - conditions: >-
            {{ is_state('light.bedroom_ikea_of_sweden_grillplats_plug', 'on') and
               is_state('light.3_in_1_controller_wifi_2_4g', 'on') }}
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.bedroom_accent_bedroom
        default:
        - action: light.turn_on
          target:
            entity_id:
            - light.bedroom_ikea_of_sweden_grillplats_plug
            - light.3_in_1_controller_wifi_2_4g
    - conditions: "{{ trigger.id == 'turn_off' }}"
      sequence:
      - action: light.turn_off
        target:
          entity_id:
          - light.bedroom_ikea_of_sweden_grillplats_plug
          - light.3_in_1_controller_wifi_2_4g
          - light.bedroom_accent_bedroom
      - action: light.turn_off
        target:
          entity_id: light.bathroom_led_bathroom
  mode: restart

- id: 'bedroom_closet_door_light'
  alias: Bedroom Closet - Door light
  description: Turns the bedroom closet light on when the MYGGBETT door opens and off when it closes.
  triggers:
  - trigger: state
    entity_id: binary_sensor.myggbett_door_window_sensor_door
    to: 'on'
    id: door_opened
  - trigger: state
    entity_id: binary_sensor.myggbett_door_window_sensor_door
    to: 'off'
    id: door_closed
  conditions: []
  actions:
  - choose:
    - conditions: "{{ trigger.id == 'door_opened' }}"
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.bedroom_closet
    - conditions: "{{ trigger.id == 'door_closed' }}"
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.bedroom_closet
  mode: restart

- id: 'lelit_espresso_machine_safety'
  alias: Lelit Espresso Machine - Two-hour safety shutoff
  description: Keeps a restorable two-hour safety timer while the espresso machine is on.
  triggers:
  - trigger: state
    entity_id: switch.ikea_of_sweden_grillplats_plug_2
    to: 'on'
    id: machine_on
  - trigger: state
    entity_id: switch.ikea_of_sweden_grillplats_plug_2
    to: 'off'
    id: machine_off
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.lelit_espresso_safety
    id: timer_finished
  - trigger: homeassistant
    event: start
    id: home_assistant_start
  conditions: []
  actions:
  - choose:
    - conditions: "{{ trigger.id == 'machine_on' }}"
      sequence:
      - action: timer.start
        target:
          entity_id: timer.lelit_espresso_safety
        data:
          duration: "02:00:00"
    - conditions: "{{ trigger.id == 'machine_off' }}"
      sequence:
      - action: timer.cancel
        target:
          entity_id: timer.lelit_espresso_safety
    - conditions: "{{ trigger.id == 'timer_finished' }}"
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.ikea_of_sweden_grillplats_plug_2
    - conditions: >-
        {{ trigger.id == 'home_assistant_start' and
           is_state('switch.ikea_of_sweden_grillplats_plug_2', 'on') and
           not is_state('timer.lelit_espresso_safety', 'active') }}
      sequence:
      - action: timer.start
        target:
          entity_id: timer.lelit_espresso_safety
        data:
          duration: "02:00:00"
  mode: restart

- id: 'jellyfin_cinema_mode'
  alias: Living Room - Jellyfin cinema mode
  description: >-
    Turns off all physical living-room lights during Jellyfin playback while
    Cinema Mode is enabled. The first play in each session snapshots their
    states; pausing, stopping, or disabling Cinema Mode restores that snapshot.
    Resuming after a pause takes a fresh snapshot of the restored state, so
    repeated pause/resume cycles do not overwrite it with the cinema-mode off
    state.
  triggers:
  - trigger: state
    entity_id: media_player.tv_w_salonie
    to: playing
    id: cinema_start
  - trigger: state
    entity_id: media_player.tv_w_salonie
    from: playing
    to: paused
    id: cinema_restore
  - trigger: state
    entity_id: media_player.tv_w_salonie
    from: playing
    to: idle
    id: cinema_restore
  - trigger: state
    entity_id: media_player.tv_w_salonie
    from: playing
    to: 'off'
    id: cinema_restore
  - trigger: state
    entity_id: media_player.tv_w_salonie
    from: playing
    to: unavailable
    id: cinema_restore
  - trigger: state
    entity_id: input_boolean.jellyfin_cinema_mode_enabled
    to: 'off'
    id: cinema_disabled
  conditions: []
  actions:
  - choose:
    - conditions: >-
        {{ trigger.id == 'cinema_start' and
           is_state('input_boolean.jellyfin_cinema_mode_enabled', 'on') and
           is_state('input_boolean.jellyfin_cinema_active', 'off') }}
      sequence:
      - action: scene.create
        data:
          scene_id: living_room_before_cinema
          snapshot_entities:
          - light.living_room_accent_1
          - light.living_room_2ch_wi_fi_switch_module_switch_2
          - light.living_room_2ch_wi_fi_switch_module_2_switch_1
          - light.living_room_2ch_wi_fi_switch_module_switch_1
          - light.living_room_balcony
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.jellyfin_cinema_active
  - choose:
    - conditions: >-
        {{ trigger.id == 'cinema_start' and
           is_state('input_boolean.jellyfin_cinema_mode_enabled', 'on') }}
      sequence:
      - action: light.turn_off
        target:
          entity_id:
          - light.living_room_accent_1
          - light.living_room_2ch_wi_fi_switch_module_switch_2
          - light.living_room_2ch_wi_fi_switch_module_2_switch_1
          - light.living_room_2ch_wi_fi_switch_module_switch_1
          - light.living_room_balcony
    - conditions: >-
        {{ trigger.id in ['cinema_restore', 'cinema_disabled'] and
           is_state('input_boolean.jellyfin_cinema_active', 'on') }}
      sequence:
      # Dynamic scenes intentionally report state "unknown"; the helper is the
      # snapshot-validity flag, so do not gate scene.turn_on on scene state.
      - action: scene.turn_on
        target:
          entity_id: scene.living_room_before_cinema
        continue_on_error: true
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.jellyfin_cinema_active
  mode: restart

- id: 'bathroom_lights_forgotten_on'
  alias: Bathroom - Forgotten lights protection
  description: Turns off each bathroom light after it has remained on for 45 minutes.
  triggers:
  - trigger: state
    entity_id:
    - light.bathroom_led_bathroom
    - switch.bathroom_lamp
    to: 'on'
    for: "00:45:00"
  conditions: []
  actions:
  - action: homeassistant.turn_off
    target:
      entity_id: "{{ trigger.entity_id }}"
  mode: parallel
  max: 2

- id: 'corridor_bilresa_home_modes'
  alias: Corridor - Welcome Home / Leave Home
  description: Maps the corridor BILRESA buttons to home scenes and French jazz lounge music.
  triggers:
  - trigger: state
    entity_id: event.bilresa_dual_button_button_1
    id: welcome_home
  - trigger: state
    entity_id: event.bilresa_dual_button_button_2
    id: leave_home
  conditions: []
  actions:
  - choose:
    - conditions: "{{ trigger.id == 'welcome_home' and trigger.to_state.attributes.event_type == 'multi_press_1' }}"
      sequence:
      - action: scene.turn_on
        target:
          entity_id: scene.welcome_home
    - conditions: "{{ trigger.id == 'welcome_home' and trigger.to_state.attributes.event_type == 'multi_press_2' }}"
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.french_jazz_lounge
    - conditions: "{{ trigger.id == 'leave_home' and trigger.to_state.attributes.event_type == 'multi_press_1' }}"
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.leave_home
  mode: restart

- id: 'living_room_tradfri_media_remote'
  alias: Living Room - TRADFRI media remote
  description: >-
    Uses the five-button TRADFRI remote for the active Zeppelin or TV: volume,
    play/pause, previous/next or TV navigation, and a long-press power-off.
  triggers:
  - trigger: device
    domain: zha
    device_id: a8940bb7824bdae5bfe525f2e61e95f3
    type: remote_button_short_press
    subtype: dim_up
    id: volume_up
  - trigger: device
    domain: zha
    device_id: a8940bb7824bdae5bfe525f2e61e95f3
    type: remote_button_long_press
    subtype: dim_up
    id: volume_up
  - trigger: device
    domain: zha
    device_id: a8940bb7824bdae5bfe525f2e61e95f3
    type: remote_button_short_press
    subtype: dim_down
    id: volume_down
  - trigger: device
    domain: zha
    device_id: a8940bb7824bdae5bfe525f2e61e95f3
    type: remote_button_long_press
    subtype: dim_down
    id: volume_down
  - trigger: device
    domain: zha
    device_id: a8940bb7824bdae5bfe525f2e61e95f3
    type: remote_button_short_press
    subtype: left
    id: previous_or_left
  - trigger: device
    domain: zha
    device_id: a8940bb7824bdae5bfe525f2e61e95f3
    type: remote_button_short_press
    subtype: right
    id: next_or_right
  conditions: []
  actions:
  - variables:
      zeppelin_playing: "{{ is_state('media_player.zeppelin', 'playing') }}"
      zeppelin_available: >-
        {{ states('media_player.zeppelin') in ['playing', 'paused'] }}
      tv_music_assistant_display: >-
        {{ state_attr('media_player.tv_w_salonie', 'app_name') == 'Music Assistant' or
           state_attr('media_player.tv_w_salonie', 'media_title') == 'Music Assistant' }}
      zeppelin_selected: >-
        {{ zeppelin_playing or
           (tv_music_assistant_display and zeppelin_available) }}
      tv_powered: >-
        {{ states('media_player.living_room_tv_2') not in
           ['off', 'unavailable', 'unknown'] }}
      active_volume_player: >-
        {% if zeppelin_playing or (tv_music_assistant_display and zeppelin_available) %}
          media_player.zeppelin
        {% elif states('media_player.living_room_tv_2') not in ['off', 'unavailable', 'unknown'] %}
          media_player.living_room_tv_2
        {% else %}
          {{ '' }}
        {% endif %}

  - choose:
    - conditions: "{{ trigger.id == 'volume_up' and active_volume_player | length > 0 }}"
      sequence:
      - action: media_player.volume_up
        target:
          entity_id: "{{ active_volume_player }}"
    - conditions: "{{ trigger.id == 'volume_down' and active_volume_player | length > 0 }}"
      sequence:
      - action: media_player.volume_down
        target:
          entity_id: "{{ active_volume_player }}"

    - conditions: "{{ trigger.id == 'previous_or_left' and zeppelin_selected }}"
      sequence:
      - action: media_player.media_previous_track
        target:
          entity_id: media_player.zeppelin
    - conditions: "{{ trigger.id == 'previous_or_left' and tv_powered }}"
      sequence:
      - action: remote.send_command
        target:
          entity_id: remote.living_room_tv
        data:
          command: DPAD_LEFT
    - conditions: "{{ trigger.id == 'next_or_right' and zeppelin_selected }}"
      sequence:
      - action: media_player.media_next_track
        target:
          entity_id: media_player.zeppelin
    - conditions: "{{ trigger.id == 'next_or_right' and tv_powered }}"
      sequence:
      - action: remote.send_command
        target:
          entity_id: remote.living_room_tv
        data:
          command: DPAD_RIGHT
  mode: queued
  max: 10

- id: 'living_room_tradfri_center_button'
  alias: Living Room - TRADFRI center button
  description: >-
    Distinguishes the remote's center-button tap from a hold. This firmware sends
    one toggle immediately and repeated toggles while held, with no release event.
  triggers:
  - trigger: event
    event_type: zha_event
    event_data:
      device_ieee: 14:b4:57:ff:fe:41:f0:e9
      cluster_id: 6
      command: toggle
  conditions: []
  actions:
  - wait_for_trigger:
    - trigger: event
      event_type: zha_event
      event_data:
        device_ieee: 14:b4:57:ff:fe:41:f0:e9
        cluster_id: 6
        command: toggle
    timeout: "00:00:03.2"
    continue_on_timeout: true
  - variables:
      center_was_held: "{{ wait.trigger is not none }}"
      tv_music_assistant_display: >-
        {{ state_attr('media_player.tv_w_salonie', 'app_name') == 'Music Assistant' or
           state_attr('media_player.tv_w_salonie', 'media_title') == 'Music Assistant' }}
      tv_powered: >-
        {{ states('media_player.living_room_tv_2') not in
           ['off', 'unavailable', 'unknown'] }}
      active_transport_player: >-
        {% set zeppelin_active = states('media_player.zeppelin') in ['playing', 'paused'] %}
        {% set tv_active = states('media_player.tv_w_salonie') in ['playing', 'paused'] and not tv_music_assistant_display %}
        {% if zeppelin_active and tv_active %}
          {% if states.media_player.zeppelin.last_changed >= states.media_player.tv_w_salonie.last_changed %}
            media_player.zeppelin
          {% else %}
            media_player.tv_w_salonie
          {% endif %}
        {% elif zeppelin_active %}
          media_player.zeppelin
        {% elif tv_active %}
          media_player.tv_w_salonie
        {% else %}
          {{ '' }}
        {% endif %}
  - choose:
    - conditions: "{{ center_was_held }}"
      sequence:
      - action: media_player.turn_off
        continue_on_error: true
        target:
          entity_id: media_player.zeppelin
      - action: media_player.turn_off
        continue_on_error: true
        target:
          entity_id: media_player.living_room_tv_2
      # Absorb further toggle repeats until the button has been quiet for 3.2 s.
      - repeat:
          sequence:
          - wait_for_trigger:
            - trigger: event
              event_type: zha_event
              event_data:
                device_ieee: 14:b4:57:ff:fe:41:f0:e9
                cluster_id: 6
                command: toggle
            timeout: "00:00:03.2"
            continue_on_timeout: true
          until: "{{ wait.trigger is none }}"
    - conditions: >-
        {{ active_transport_player | length > 0 and
           states(active_transport_player) == 'paused' }}
      sequence:
      - action: media_player.media_play
        target:
          entity_id: "{{ active_transport_player }}"
    - conditions: >-
        {{ active_transport_player | length > 0 and
           states(active_transport_player) == 'playing' }}
      sequence:
      - action: media_player.media_pause
        target:
          entity_id: "{{ active_transport_player }}"
    - conditions: "{{ tv_powered }}"
      sequence:
      - action: remote.send_command
        target:
          entity_id: remote.living_room_tv
        data:
          command: MEDIA_PLAY_PAUSE
  mode: single
  max_exceeded: silent

